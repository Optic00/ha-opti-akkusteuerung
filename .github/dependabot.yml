version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # requirements-test.txt pinnt die HA-Mindestversion 2026.9.1,
  # requirements-test-ha-2026.10.txt die aktuelle HA-Testversion.
  # HA-Update-PRs gegen diesen Vertrag prüfen; die Mindestversion nie still anheben.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    # pytest-homeassistant-custom-component pinnt diese Pakete exakt; sie
    # folgen dem HA-Test-Stack und lassen sich nicht einzeln anheben. Bei einem
    # HA-Stack-Update die Pins in beiden requirements-test*.txt von Hand angleichen.
    ignore:
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
    groups:
      home-assistant-test-stack:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
      test-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
