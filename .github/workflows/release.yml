name: Prepare release

on:
  push:
    tags: ['20*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to prepare
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # On tag pushes, the event SHA is the peeled commit. Passing it
          # explicitly prevents checkout from rewriting the local tag to it.
          # Manual recovery checks out the existing tag without moving it.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build and verify release package
        run: |
          python tools/build_package.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/package"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          python tools/build_package.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/package-check"
          cmp "$RUNNER_TEMP/package/opti_akku-$RELEASE_TAG.zip" "$RUNNER_TEMP/package-check/opti_akku-$RELEASE_TAG.zip"
      - name: Create draft with verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          existing = (Path(os.environ["RUNNER_TEMP"]) / "release-tags.txt").read_text().splitlines()
          if os.environ["RELEASE_TAG"] in existing:
              raise SystemExit("A release or draft for this tag already exists; inspect it before retrying")
          PYCODE
          flags=()
          if [[ "$RELEASE_TAG" == *-beta* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/package/opti_akku-$RELEASE_TAG.zip" \
            --verify-tag --draft --title "Opti Akku $RELEASE_TAG" --generate-notes "${flags[@]}"
