- id: "opti_canonical_strategie"
  alias: "Akku Opti Strategie"
  description: >-
    Strategie auf dem Canonical-opti_*-Layer (Paket 3). Setzt ausschliesslich
    input_select.akkusteuerung_modus. Prognosebasierte SOC-Ladeblöcke
    (Score+Preis), PV-/AC-Überschussblöcke, MinSOC-Schutz und Cleanup.
    Quellen/Gates getauscht; aufgeschobene und arbitrage-basierte Zweige entfernt.
    id/Alias sind der Live-Realität angeglichen (2026-07-01): id war zuvor eine
    HA-generierte Zahl ohne Bedeutung, Alias hieß zuvor "Akku Lade-
    Entladesteuerung Opti 2.0" bzw. live "Akku Opti Canonical (opti_*-Layer)".
  mode: single
  triggers:
    # Preisniveau (Enum) statt Tibber-Rohsensor
    - trigger: state
      entity_id:
        - sensor.opti_price_level
      id: "Preisniveau geändert"
    - trigger: state
      entity_id:
        - input_boolean.akku_opti_automatik
      to: "on"
      id: "Akku Opti-Automatik AN/AUS"
    # Batterie-SoC (Canonical) statt Hardware-Rohsensor
    - trigger: state
      entity_id:
        - sensor.opti_soc
      id: "SoC Änderung"
    # Entladeschwelle: beide Werte jetzt ct/kWh (Canonical)
    - trigger: numeric_state
      entity_id:
        - sensor.opti_mindestentladepreis_ct_kwh
      below: sensor.opti_price_current_ct_kwh
      id: "Entladeschwelle"
    # Überschuss-Signale: entprellte Binärsensoren (akkuunabhängig, Hysterese,
    # 30 s beidseitig in opti_derived.yaml) statt Rohwert-Schwellen. Beide
    # Flanken triggern, damit auch das Zurückschalten sofort neu bewertet wird.
    - trigger: state
      entity_id:
        - binary_sensor.opti_ueberschuss_ac_aktiv
      to:
        - "on"
        - "off"
      id: "AC-Überschuss geändert"
    - trigger: state
      entity_id:
        - binary_sensor.opti_ueberschuss_70_aktiv
      to:
        - "on"
        - "off"
      id: "PV-70%-Überschuss geändert"
    # Prognose-Scores statt PV-Forecast-Bewertungslabels
    - trigger: state
      entity_id:
        - sensor.opti_forecast_score
        - sensor.opti_forecast_score_tomorrow
      id: "Prognose-Score geändert"
    # Dynamische Ladestärke (Canonical)
    - trigger: state
      entity_id:
        - sensor.opti_charge_power_w
      id: "Dynamische Ladestärke geändert"
    # Ziel-SoC (Canonical)
    - trigger: state
      entity_id:
        - sensor.opti_target_soc
      id: "Target SoC geändert"
    # Akku voll
    - trigger: numeric_state
      entity_id:
        - sensor.opti_soc
      above: 99
      id: "Akku ist voll"
    - trigger: state
      entity_id:
        - input_number.minsoc
      id: "MinSOC geändert"
    - trigger: state
      entity_id:
        - input_number.maxsoc
      id: "MaxSOC geändert"
    # Neue Gates/Toggles (Paket 3)
    - trigger: state
      entity_id:
        - input_boolean.opti_prognose_netzladen
      id: "Prognose-Netzladen-Toggle geändert"
    - trigger: state
      entity_id:
        - input_boolean.opti_pv_ueberschuss_ladung
      id: "PV-Überschuss-Toggle geändert"
    - trigger: state
      entity_id:
        - binary_sensor.opti_winter_charging_allowed
      id: "Winterladefreigabe geändert"
    # Peak-Allokation: aktueller Preis (stuendlich) + Reserve-Sensor + Gate
    - trigger: state
      entity_id:
        - sensor.opti_price_current_ct_kwh
      id: "Preis geändert"
    - trigger: state
      entity_id:
        - sensor.opti_peak_reserve_soc
        - binary_sensor.opti_peak_reserve_aktiv
      id: "Peak-Reserve geändert"
    # Balancing-/Deep-Charge-Watchdog: sonst bliebe der Modus nach einem
    # Watchdog-Zustandswechsel (aus/pv/netz) stale.
    - trigger: state
      entity_id:
        - sensor.opti_balancing_watchdog
      id: "Balancing-Watchdog geändert"
  conditions:
    - condition: state
      entity_id: input_boolean.akku_opti_automatik
      state: "on"
  actions:
    # CLEANUP (immer, kein has_value-/Toggle-Gate): Counter zuruecksetzen, wenn der
    # Akku den Done-SoC erreicht hat. Eine einzige Voll-/Done-Definition:
    # opti_balancing_done_soc (Default 98.5%). for: 30 min -> erst als "erledigt"
    # zaehlen, wenn der Akku stabil oben steht (kein kurzer Spike). Bleibt
    # per-Execution-Cleanup (laeuft bei JEDER Automationsausfuehrung), nicht nur
    # kantengetriggert. Der Balancing-Watchdog laedt bis 100 (CV-Phase), der
    # Counter-Reset lehnt bewusst schon bei done_soc ab -> Watchdog feuert nicht
    # unnoetig, sobald der Akku regulaer ~voll war.
    - alias: "Counter auf 0 setzen bei erreichtem Done-SoC (30 min stabil)"
      choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.opti_soc
              above: input_number.opti_balancing_done_soc
              for:
                minutes: 30
          sequence:
            - action: counter.reset
              target:
                entity_id: counter.tage_seit_akku100

    - alias: "Zwischen Speicherszenarien wählen"
      choose:
        # OBERSTE PRIORITÄT: Entladesperre <minsoc — vor allen anderen geprüft.
        # Läuft IMMER (kein has_value-Gate); fehlt opti_soc, greift die
        # numeric_state-Bedingung schlicht nicht (fail-safe).
        - alias: "Modus 'nur Laden' (Entladesperre): MinSOC-Schutz, SOC unter MinSOC (tag+nacht)"
          conditions:
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: input_number.minsoc
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "MinSOC Schutz aktiv – Entladen gesperrt"

        # Negativpreis-Laderegel mit Ladefenster-Wahl: Preis unter der eigenen
        # Einspeiseverguetung (deckt negative Preise ab) + schlechte Prognose ->
        # Netzladen lohnt immer. Fenster-Bedingung: nicht greedy laden, wenn vor
        # der naechsten Preisspitze noch eine guenstigere Stunde kommt (Marge 0.5 ct).
        # Fail-safe: Reserve-Sensor unavailable -> minv none -> einfacher EEG-Vergleich.
        - alias: "Modus 'Netzladen': Preis unter Einspeiseverguetung, Prognose schlecht (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: template
              value_template: >-
                {% set stopband = 0 if is_state('input_select.akkusteuerung_modus', 'Akku Netzladen') else 3 %}
                {{ has_value('sensor.opti_price_current_ct_kwh')
                   and has_value('sensor.opti_forecast_score')
                   and has_value('sensor.opti_soc')
                   and (states('sensor.opti_forecast_score') | float) < 3
                   and (states('sensor.opti_soc') | float) < (states('input_number.maxsoc') | float(95) - stopband)
                   and (states('sensor.opti_price_current_ct_kwh') | float) < (states('input_number.opti_einspeiseverguetung_ct') | float(0)) }}
            - alias: "Ladefenster: kein guenstigeres Fenster vor der naechsten Spitze"
              condition: template
              value_template: >-
                {% set cur = states('sensor.opti_price_current_ct_kwh') | float(0) %}
                {% set minv = state_attr('sensor.opti_peak_reserve_soc', 'min_preis_vor_peak_ct') %}
                {{ minv is none or cur <= (minv | float(cur)) + 0.5 }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Netzladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Peak-Vorladeregel (spread-basiert): kommende Spitzen sind deutlich teurer
        # als jetzt -> gezielt bis reserve_gesamt_soc nachladen (nicht bis maxsoc).
        # Stoppt selbsttaetig, sobald SoC die Reserve erreicht (Bedingung entfaellt).
        # Ladefenster-Wahl wie bei der Negativpreis-Regel (selbstkorrigierend).
        - alias: "Modus 'Netzladen' (Peak-Vorladen): Spread zur kommenden Spitze gross genug (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: state
              entity_id: binary_sensor.opti_peak_reserve_aktiv
              state: "on"
            - condition: template
              value_template: >-
                {% set cur = states('sensor.opti_price_current_ct_kwh') | float(none) %}
                {% set soc = states('sensor.opti_soc') | float(none) %}
                {% set ges = states('sensor.opti_peak_reserve_soc') | float(none) %}
                {% set avg = state_attr('sensor.opti_peak_reserve_soc', 'peak_preis_avg_ct') | float(none) %}
                {% set spread_min = states('input_number.opti_netzlade_spread_ct') | float(10) %}
                {% set minv = state_attr('sensor.opti_peak_reserve_soc', 'min_preis_vor_peak_ct') %}
                {% set stopband = 0 if is_state('input_select.akkusteuerung_modus', 'Akku Netzladen') else 3 %}
                {{ cur is not none and soc is not none and ges is not none and avg is not none
                   and soc < ges - stopband
                   and (avg - cur) >= spread_min
                   and (minv is none or cur <= (minv | float(cur)) + 0.5) }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Netzladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # ---------------------------------------------------------------------
        # Peak-Leiter L1/L2 (Entlade-Stufen der Entlade-Allokation): nur aktiv
        # wenn das Gate an ist (= Peaks im Wiederauflade-Horizont, Reserve-
        # Sensor gueltig). Die Entlade-Stufen der Leiter stehen VOR den alten
        # Ladebloecken (Ben-Entscheidung 2026-07-02): Peak-Entladen schlaegt
        # Winterladen; die Halte-Stufen L3/L4 bleiben hinter den Ladebloecken
        # (guenstiges Laden schlaegt Halten).
        # ---------------------------------------------------------------------
        - alias: "Peak-Leiter L1 'nur Entladen': Preisspitze VERY_EXPENSIVE"
          conditions:
            - condition: state
              entity_id: binary_sensor.opti_peak_reserve_aktiv
              state: "on"
            - condition: template
              value_template: "{{ has_value('sensor.opti_soc') }}"
            - condition: state
              entity_id: sensor.opti_price_level
              state: "VERY_EXPENSIVE"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Entladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        - alias: "Peak-Leiter L2 'nur Entladen': EXPENSIVE, SoC ueber VE-Reserve"
          conditions:
            - condition: state
              entity_id: binary_sensor.opti_peak_reserve_aktiv
              state: "on"
            - condition: state
              entity_id: sensor.opti_price_level
              state: "EXPENSIVE"
            - condition: template
              value_template: >-
                {% set soc = states('sensor.opti_soc') | float(none) %}
                {% set ve = state_attr('sensor.opti_peak_reserve_soc', 'reserve_ve_soc') | float(none) %}
                {% set band = 5 if is_state('input_select.akkusteuerung_modus', 'Akku nur Laden') else 3 %}
                {{ soc is not none and ve is not none and soc > ve + band }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Entladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # ---------------------------------------------------------------------
        # Balancing-/Deep-Charge-Watchdog (Feature #31): laedt den Akku gezielt
        # einmalig hoch, wenn er zu lange nicht ~voll war (BMS-Balancing des BYD
        # HVS). Entscheidung komplett im abgeleiteten sensor.opti_balancing_watchdog
        # (aus/pv/netz) - restart-durabel, kein Latch. Position bewusst NACH der
        # Peak-Entlade-Leiter L1/L2 (aktiver Peak schlaegt Balancing) und VOR den
        # Prognose-Ladebloecken. 'pv' = tagsueber PV-Vollladung, 'netz' = guenstiges/
        # gratis Netzladen fuers BMS.
        # ---------------------------------------------------------------------
        - alias: "Modus 'nur Laden' (Balancing-Watchdog): tagsueber PV-Vollladung fuers BMS-Balancing"
          conditions:
            - condition: state
              entity_id: sensor.opti_balancing_watchdog
              state: "pv"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        - alias: "Modus 'Netzladen' (Balancing-Watchdog): guenstiges/gratis Netzladen fuers BMS-Balancing"
          conditions:
            - condition: state
              entity_id: sensor.opti_balancing_watchdog
              state: "netz"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Netzladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Winter-/Prognose-Ladeblock (SOC < 20 %).
        # Quelle: heute+morgen schlecht → Score<3 (beide); Preis VERY_CHEAP..EXPENSIVE.
        # Gates: opti_prognose_netzladen on + opti_winter_charging_allowed on.
        - alias: "Modus 'nur Laden' (Reserve halten): Prognose heute+morgen schlecht, SOC unter 20% (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: state
              entity_id: binary_sensor.opti_winter_charging_allowed
              state: "on"
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_forecast_score')
                   and has_value('sensor.opti_forecast_score_tomorrow') }}
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 20
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score
              below: 3
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score_tomorrow
              below: 3
            - alias: "Aktuelles Preisniveau VERY_CHEAP bis EXPENSIVE"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "NORMAL"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "EXPENSIVE"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Winter-/Prognose-Ladeblock (SOC < 75 %). Preis nur bis NORMAL.
        # opti_winter_charging_allowed hier NICHT — opportunistischer Block, soll ganzjährig greifen.
        - alias: "Modus 'nur Laden' (Reserve halten): Prognose heute+morgen schlecht, SOC unter 75%, Preis bis NORMAL (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_forecast_score')
                   and has_value('sensor.opti_forecast_score_tomorrow') }}
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 75
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score
              below: 3
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score_tomorrow
              below: 3
            - alias: "Aktuelles Preisniveau VERY_CHEAP bis NORMAL"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "NORMAL"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Winter-/Prognose-Ladeblock (SOC < 80 %, Wintermodus-Gate).
        # Sommermodus-Gate der Quelle → binary_sensor.opti_winter_charging_allowed.
        - alias: "Modus 'nur Laden' (Reserve halten): Prognose schlecht, Wintermodus, SOC unter 80% (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: state
              entity_id: binary_sensor.opti_winter_charging_allowed
              state: "on"
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_forecast_score')
                   and has_value('sensor.opti_forecast_score_tomorrow') }}
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 80
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score
              below: 3
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score_tomorrow
              below: 3
            - alias: "Aktuelles Preisniveau VERY_CHEAP bis EXPENSIVE"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "NORMAL"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "EXPENSIVE"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Winter-/Prognose-Ladeblock (SOC < 15 %, Notfall). Nur heute-Score.
        # KEIN opti_winter_charging_allowed-Gate — Notfall-Netzladen DARF NIE durch das
        # Saisonal-Gate blockiert werden. Dieser Block muss ganzjährig und im Sommer greifen.
        - alias: "Modus 'nur Laden' (Reserve halten): heute schlecht, SOC unter 15% (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: template
              value_template: "{{ has_value('sensor.opti_forecast_score') }}"
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 15
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score
              below: 3
            - alias: "Aktuelles Preisniveau VERY_CHEAP bis EXPENSIVE"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "NORMAL"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "EXPENSIVE"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Winter-/Prognose-Ladeblock (SOC < 45 %, nur sehr günstig). Nur heute-Score.
        # opti_winter_charging_allowed hier NICHT — Opportunistik-Block, soll ganzjährig greifen.
        - alias: "Modus 'nur Laden' (Reserve halten): heute schlecht, SOC unter 45%, Strom sehr günstig (tag+nacht)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_prognose_netzladen
              state: "on"
            - condition: template
              value_template: "{{ has_value('sensor.opti_forecast_score') }}"
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 45
            - condition: numeric_state
              entity_id: sensor.opti_forecast_score
              below: 3
            - alias: "Aktuelles Preisniveau VERY_CHEAP oder CHEAP"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # ENTFERNT: Zweig zur Umleitung bei drohender Erzeugungskappung (aufgeschoben, Paket >3).

        # Überschuss-Block: 70%-Einspeise-Überschuss in den Akku (nur tagsüber).
        - alias: "Modus 'Dynamisch': 70% PV-Überschuss in den Akku (nur tagsüber)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_pv_ueberschuss_ladung
              state: "on"
            - condition: sun
              after: sunrise
              before: sunset
            # Entprelltes, akkuunabhängiges Signal (opti_derived.yaml) statt
            # Rohwert: verhindert, dass ein anderer Trigger den Zweig mit dem
            # Momentanwert sofort zieht (Flatter-Fix 2026-07-03).
            - condition: state
              entity_id: binary_sensor.opti_ueberschuss_70_aktiv
              state: "on"
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 100
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Dynamisch"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Überschuss-Block: AC-Überschuss (PV-Leistung über Grenze) in den Akku (nur tagsüber).
        - alias: "Modus 'Dynamisch': AC-PV-Überschuss in den Akku (nur tagsüber)"
          conditions:
            - condition: state
              entity_id: input_boolean.opti_pv_ueberschuss_ladung
              state: "on"
            - condition: sun
              after: sunrise
              before: sunset
            # Entprelltes, akkuunabhängiges Signal, siehe 70%-Zweig.
            - condition: state
              entity_id: binary_sensor.opti_ueberschuss_ac_aktiv
              state: "on"
            - condition: numeric_state
              entity_id: sensor.opti_soc
              below: 100
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Dynamisch"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Modus-Set-Zweig: voller Akku → Dynamisch.
        - alias: "Modus 'Dynamisch': Akku voll (SOC über 99%)"
          conditions:
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_soc')
                   and has_value('sensor.opti_battery_capacity_kwh') }}
            - condition: numeric_state
              entity_id: sensor.opti_soc
              above: 99
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Dynamisch"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # ---------------------------------------------------------------------
        # Peak-Leiter L3/L4 (Halte-Stufen der Entlade-Allokation): nur aktiv
        # wenn das Gate an ist (= Peaks im Wiederauflade-Horizont, Reserve-
        # Sensor gueltig). MUSS vor den Ziel-SoC-Optionen stehen, sonst
        # verheizt "nur Entladen ueber Ziel-SoC" die Reserve bei NORMAL-Preis.
        # Die Entlade-Stufen der Leiter stehen VOR den alten Ladebloecken
        # (Ben-Entscheidung 2026-07-02): Peak-Entladen schlaegt Winterladen;
        # die Halte-Stufen L3/L4 bleiben hinter den Ladebloecken (guenstiges
        # Laden schlaegt Halten).
        # Freigabeband asymmetrisch: aus dem Halten erst bei Reserve+5 wieder
        # freigeben, beim Entladen bis Reserve+3 runter (Modus = Gedaechtnis).
        # L3-Halte-Spread (Tuning-Hebel 2): zusaetzlich muss der VE-Preis-
        # durchschnitt der kommenden Peak-Stunden mindestens
        # opti_halte_spread_ct ueber dem aktuellen Preis liegen - Halten ohne
        # echten VE-Vorteil kostet nur Netzbezug. Greift die Bedingung nicht,
        # faellt EXPENSIVE ohne Halten durch (L2 hat oberhalb der VE-Reserve
        # bereits entladen; unterhalb geht es zu den Ziel-SoC-Optionen/Default).
        # ---------------------------------------------------------------------
        - alias: "Peak-Leiter L3 'nur Laden' (halten): EXPENSIVE, Reserve fuer VERY_EXPENSIVE"
          conditions:
            - condition: state
              entity_id: binary_sensor.opti_peak_reserve_aktiv
              state: "on"
            - condition: state
              entity_id: sensor.opti_price_level
              state: "EXPENSIVE"
            - condition: template
              value_template: >-
                {% set soc = states('sensor.opti_soc') | float(none) %}
                {% set ve = state_attr('sensor.opti_peak_reserve_soc', 'reserve_ve_soc') | float(none) %}
                {% set band = 5 if is_state('input_select.akkusteuerung_modus', 'Akku nur Laden') else 3 %}
                {{ soc is not none and ve is not none and soc <= ve + band }}
            - condition: template
              value_template: >-
                {% set ve_avg = state_attr('sensor.opti_peak_reserve_soc', 'peak_preis_ve_avg_ct') | float(none) %}
                {% set cur = states('sensor.opti_price_current_ct_kwh') | float(none) %}
                {% set halte_spread = states('input_number.opti_halte_spread_ct') | float(3) %}
                {{ ve_avg is not none and cur is not none and (ve_avg - cur) >= halte_spread }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        - alias: "Peak-Leiter L4 'nur Laden' (halten): Preis normal/billig, Reserve fuer Peaks"
          conditions:
            - condition: state
              entity_id: binary_sensor.opti_peak_reserve_aktiv
              state: "on"
            - alias: "Preisniveau NORMAL oder billiger"
              condition: or
              conditions:
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "VERY_CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "CHEAP"
                - condition: state
                  entity_id: sensor.opti_price_level
                  state: "NORMAL"
            - condition: template
              value_template: >-
                {% set soc = states('sensor.opti_soc') | float(none) %}
                {% set ges = states('sensor.opti_peak_reserve_soc') | float(none) %}
                {% set band = 5 if is_state('input_select.akkusteuerung_modus', 'Akku nur Laden') else 3 %}
                {{ soc is not none and ges is not none and soc <= ges + band }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Modus-Set-Zweig: dynamisch laden zwischen MinSoC und Ziel-SoC (nur tagsüber).
        - alias: "Modus 'Dynamisch': SOC zwischen MinSoC und Ziel-SoC (nur tagsüber)"
          conditions:
            # Band H=3 %: native numeric_state kann 'entity - offset' nicht ausdruecken,
            # daher Template-Bedingung (soc > minsoc UND soc < target - H).
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_soc')
                   and has_value('sensor.opti_battery_capacity_kwh')
                   and has_value('sensor.opti_target_soc')
                   and (states('sensor.opti_soc') | float) > (states('input_number.minsoc') | float(10))
                   and (states('sensor.opti_soc') | float) < (states('sensor.opti_target_soc') | float - 3) }}
            - condition: sun
              after: sunrise
              before: sunset
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku Dynamisch"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

        # Modus-Set-Zweig: nur Entladen wenn SOC über Ziel-SoC.
        - alias: "Modus 'nur Entladen': SOC über Ziel-SoC"
          conditions:
            # Band H=3 %: nur Entladen erst wenn soc > target + H (Template, da Offset).
            - condition: template
              value_template: >-
                {{ has_value('sensor.opti_soc')
                   and has_value('sensor.opti_battery_capacity_kwh')
                   and has_value('sensor.opti_target_soc')
                   and (states('sensor.opti_soc') | float) > (states('sensor.opti_target_soc') | float + 3) }}
          sequence:
            - action: input_select.select_option
              data:
                option: "Akku nur Entladen"
              target:
                entity_id: input_select.akkusteuerung_modus
            - stop: "fertig"

      # Default (Modus-Set): nur setzen wenn opti_soc UND opti_battery_capacity_kwh
      # verfügbar sind – sonst tut die Strategie nichts (fail-safe).
      default:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ has_value('sensor.opti_soc')
                       and has_value('sensor.opti_battery_capacity_kwh') }}
              sequence:
                - action: input_select.select_option
                  data:
                    option: "Akku Dynamisch"
                  target:
                    entity_id: input_select.akkusteuerung_modus

    # CLEANUP (immer, kein has_value-/Toggle-Gate): Netzlade-Booster bei vollem Akku aus.
    - alias: "Netzladen: Booster deaktivieren wenn Akku voll"
      choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.opti_soc
              above: 99
            - condition: state
              entity_id: input_boolean.hausakku_aus_netz_laden
              state: "on"
          sequence:
            - action: input_boolean.turn_off
              data: {}
              target:
                entity_id: input_boolean.hausakku_aus_netz_laden
            - action: input_number.set_value
              alias: "Ladepreis Helfer nach aktuellem Strompreis (EUR/kWh)"
              data:
                value: "{{ states('sensor.opti_price_current_ct_kwh') | float(0) / 100 }}"
              target:
                entity_id: input_number.ladepreis
            - action: input_select.select_option
              data:
                option: "Akku nur Laden"
              target:
                entity_id: input_select.akkusteuerung_modus
