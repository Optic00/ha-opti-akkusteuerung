# =============================================================================
# opti_mapping.example.yaml — Canonical-Mapping: Beispiel-Datei (öffentlich)
# =============================================================================
# Diese Datei als Vorlage kopieren nach: packages/opti_mapping.yaml
# Dann alle DEIN_*-Platzhalter durch echte Entitäts-IDs ersetzen.
#
# Einheiten-Konventionen (verbindlich für Paket-2+-Komponenten):
#   Preise:   ct/kWh  (EUR→ct wird NUR HIER ×100 normalisiert — nicht downstream)
#   Leistung: W       (Watt, im Sensor-Namen als _w)
#   Energie:  kWh     (im Sensor-Namen als _kwh)
#
# Vorzeichen-Konventionen:
#   opti_grid_export_w    >= 0  (positiv = Einspeisung ins Netz)
#   opti_battery_power_w  += laden  (positiv = Batterie lädt)
#
# Jeder Sensor hat:
#   unique_id: opti_mapping_<name>  - interne Kennung, KEINE Entity-ID
#   name: "Opti …" → HA leitet daraus die Entity-ID sensor.opti_<name> ab
#   availability: prüft ob die Pflicht-Quelle verfügbar ist
#
# Wichtig: Strategie, Dashboard und Doku sprechen die aus dem NAMEN abgeleitete
# Entity-ID an, nie die unique_id. Beispiel: der Block mit
# `unique_id: opti_mapping_battery_capacity_kwh` und
# `name: "Opti Battery Capacity kWh"` erzeugt beim erstmaligen Anlegen die
# Entity `sensor.opti_battery_capacity_kwh` - und genau die wird überall
# erwartet. Beim ersten Start also einmal unter Entwicklerwerkzeuge → Zustände
# gegenprüfen: existiert die ID bereits (etwa aus einem früheren Versuch),
# hängt HA ein `_2` an, und eine spätere Umbenennung in der UI überschreibt
# die ID ebenfalls. In beiden Fällen die Entity umbenennen statt die Strategie
# anzupassen.
# =============================================================================

template:
  - sensor:

      # -----------------------------------------------------------------------
      # 1. Batterie SoC (%)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_soc
        name: "Opti SoC"
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_SOC') }}"
        state: "{{ states('sensor.DEIN_SOC') | float(0) }}"

      # -----------------------------------------------------------------------
      # 2. Batterie-Temperatur (°C) — optional
      # availability immer true; falls kein Sensor vorhanden, gilt 20 °C als
      # neutraler Default (keine Abregelung wegen fehlender Temperatur).
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_battery_temp
        name: "Opti Battery Temp"
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ true }}"
        state: "{{ states('sensor.DEIN_BATTERIE_TEMP') | float(20) }}"

      # -----------------------------------------------------------------------
      # 3. Batterie-Nennkapazität (kWh)
      # Quelle liefert kWh → direkt übernehmen:
      #   state: "{{ states('sensor.DEIN_BATTERIE_KAPAZITAET') | float(0) }}"
      # Quelle liefert Wh → durch 1000 teilen (z.B. SMA batterie_nennkapazitaet
      # in Wh — typisch 12800 Wh = 12,8 kWh):
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_battery_capacity_kwh
        name: "Opti Battery Capacity kWh"
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_BATTERIE_KAPAZITAET') }}"
        # Quelle in Wh → /1000 (SMA-Standard):
        state: "{{ states('sensor.DEIN_BATTERIE_KAPAZITAET') | float(0) / 1000 }}"
        # Quelle direkt in kWh (auskommentieren und obige Zeile entfernen):
        # state: "{{ states('sensor.DEIN_BATTERIE_KAPAZITAET') | float(0) }}"

      # -----------------------------------------------------------------------
      # 4. PV-Leistung (W) — Wechselrichter AC-Ausgangsleistung
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_pv_power_w
        name: "Opti PV Power W"
        unit_of_measurement: "W"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_PV_POWER') }}"
        state: "{{ states('sensor.DEIN_PV_POWER') | float(0) }}"

      # -----------------------------------------------------------------------
      # 5. PV-Erzeugung (W) — DC-Eingangsleistung / Gesamterzeugung
      # Bei manchen Anlagen identisch mit opti_pv_power_w (gleiche Quelle möglich).
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_pv_generation_w
        name: "Opti PV Generation W"
        unit_of_measurement: "W"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_PV_GENERATION') }}"
        state: "{{ states('sensor.DEIN_PV_GENERATION') | float(0) }}"

      # -----------------------------------------------------------------------
      # 6. Netz-Einspeisung (W) — IMMER >= 0 (positiv = Einspeisung ins Netz)
      #
      # Vorzeichen-Rezept:
      #   Quelle positiv = Einspeisung (SMA, Fronius etc.):
      #     state: "{{ [0, states('sensor.DEIN_GRID_EXPORT') | float(0)] | max }}"
      #   Quelle positiv = Netzbezug (Einspeisung ist negativ):
      #     state: "{{ [0, states('sensor.DEIN_GRID_EXPORT') | float(0) * -1] | max }}"
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_grid_export_w
        name: "Opti Grid Export W"
        unit_of_measurement: "W"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_GRID_EXPORT') }}"
        # Standard: Quelle positiv = Einspeisung → auf >= 0 clippen
        state: "{{ [0, states('sensor.DEIN_GRID_EXPORT') | float(0)] | max }}"
        # Alternative: Quelle positiv = Netzbezug (Einspeisung negativ) → Vorzeichen drehen:
        # state: "{{ [0, states('sensor.DEIN_GRID_EXPORT') | float(0) * -1] | max }}"

      # -----------------------------------------------------------------------
      # 6b. Netz-Bezug (W) — IMMER >= 0 (positiv = Bezug aus dem Netz)
      # Symmetrisch zu opti_grid_export_w, nur mit umgekehrtem Vorzeichen.
      #
      # Vorzeichen-Rezept:
      #   Quelle positiv = Netzbezug (SMA metering_power_absorbed, eigener Bezugs-Zähler):
      #     state: "{{ [0, states('sensor.DEIN_GRID_IMPORT') | float(0)] | max }}"
      #   Quelle positiv = Einspeisung (Bezug ist negativ, z. B. ein signierter Netz-Zähler):
      #     state: "{{ [0, states('sensor.DEIN_GRID_IMPORT') | float(0) * -1] | max }}"
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_grid_import_w
        name: "Opti Grid Import W"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_GRID_IMPORT') }}"
        # Standard: Quelle positiv = Netzbezug → auf >= 0 clippen
        state: "{{ [0, states('sensor.DEIN_GRID_IMPORT') | float(0)] | max }}"
        # Alternative: Quelle positiv = Einspeisung (Bezug negativ) → Vorzeichen drehen:
        # state: "{{ [0, states('sensor.DEIN_GRID_IMPORT') | float(0) * -1] | max }}"

      # -----------------------------------------------------------------------
      # 7. Hausverbrauch (W)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_house_consumption_w
        name: "Opti House Consumption W"
        unit_of_measurement: "W"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_HAUSVERBRAUCH') }}"
        state: "{{ states('sensor.DEIN_HAUSVERBRAUCH') | float(0) }}"

      # -----------------------------------------------------------------------
      # 8. Aktueller Strompreis (ct/kWh)
      # Quelle liefert EUR/kWh → ×100 = ct/kWh (Normalisierung NUR HIER)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_price_current_ct_kwh
        name: "Opti Price Current ct kWh"
        unit_of_measurement: "ct/kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_STROMPREIS') }}"
        state: "{{ states('sensor.DEIN_STROMPREIS') | float(0) * 100 }}"

      # -----------------------------------------------------------------------
      # 9. Preis-Reihe (state = aktueller Preis in ct/kWh;
      #    Attribute today/tomorrow = Listen in ct/kWh)
      # Quelle: sensor.DEIN_PREIS_REIHE mit Attributen 'today'/'tomorrow'.
      # Items dürfen Zahlen ODER Dicts mit Schlüssel 'total'/'price'/'value' sein.
      # 'tomorrow' fehlt/leer → leere Liste [], kein Fehler.
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_price_series
        name: "Opti Price Series"
        unit_of_measurement: "ct/kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_PREIS_REIHE') }}"
        state: "{{ states('sensor.DEIN_PREIS_REIHE') | float(0) * 100 }}"
        attributes:
          today: >
            {% set arr = state_attr('sensor.DEIN_PREIS_REIHE', 'today') %}
            {% set ns = namespace(o=[]) %}
            {% if arr is iterable and arr is not string %}
              {% for it in arr %}
                {% set p = it.get('total', it.get('price', it.get('value'))) if it is mapping else it %}
                {% set p = p | float(none) %}
                {% if p is not none %}{% set ns.o = ns.o + [p * 100] %}{% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.o }}
          tomorrow: >
            {% set arr = state_attr('sensor.DEIN_PREIS_REIHE', 'tomorrow') %}
            {% set ns = namespace(o=[]) %}
            {% if arr is iterable and arr is not string %}
              {% for it in arr %}
                {% set p = it.get('total', it.get('price', it.get('value'))) if it is mapping else it %}
                {% set p = p | float(none) %}
                {% if p is not none %}{% set ns.o = ns.o + [p * 100] %}{% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.o }}

      # -----------------------------------------------------------------------
      # 10. PV-Prognose heute (kWh)
      # Attribut estimate10: P10-Schätzung (pessimistischer Wert für Worst-Case-Planung)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_forecast_today_kwh
        name: "Opti Forecast Today kWh"
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_SOLCAST_HEUTE') }}"
        state: "{{ states('sensor.DEIN_SOLCAST_HEUTE') | float(0) }}"
        attributes:
          # Nur setzen, wenn die Quelle ein P10 hat - sonst none (fehlend), NICHT 0.
          # opti_derived.yaml behandelt estimate10 <= 0 als "keine P10-Schaetzung".
          estimate10: "{{ state_attr('sensor.DEIN_SOLCAST_HEUTE', 'estimate10') if state_attr('sensor.DEIN_SOLCAST_HEUTE', 'estimate10') is not none else none }}"

      # -----------------------------------------------------------------------
      # 11. PV-Prognose morgen (kWh)
      # Attribut estimate10: P10-Schätzung (pessimistischer Wert für Worst-Case-Planung)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_forecast_tomorrow_kwh
        name: "Opti Forecast Tomorrow kWh"
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_SOLCAST_MORGEN') }}"
        state: "{{ states('sensor.DEIN_SOLCAST_MORGEN') | float(0) }}"
        attributes:
          # Nur setzen, wenn die Quelle ein P10 hat - sonst none (fehlend), NICHT 0.
          # opti_derived.yaml behandelt estimate10 <= 0 als "keine P10-Schaetzung".
          estimate10: "{{ state_attr('sensor.DEIN_SOLCAST_MORGEN', 'estimate10') if state_attr('sensor.DEIN_SOLCAST_MORGEN', 'estimate10') is not none else none }}"

      # -----------------------------------------------------------------------
      # 12. PV-Prognose verbleibend heute (kWh)
      # Attribut estimate10: P10-Schätzung (pessimistischer Wert für Worst-Case-Planung)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_forecast_remaining_today_kwh
        name: "Opti Forecast Remaining Today kWh"
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEIN_SOLCAST_VERBLEIBEND') }}"
        state: "{{ states('sensor.DEIN_SOLCAST_VERBLEIBEND') | float(0) }}"
        attributes:
          # Nur setzen, wenn die Quelle ein P10 hat - sonst none (fehlend), NICHT 0.
          # opti_derived.yaml behandelt estimate10 <= 0 als "keine P10-Schaetzung".
          estimate10: "{{ state_attr('sensor.DEIN_SOLCAST_VERBLEIBEND', 'estimate10') if state_attr('sensor.DEIN_SOLCAST_VERBLEIBEND', 'estimate10') is not none else none }}"

      # -----------------------------------------------------------------------
      # 13. Batterie-Leistung (W) — += laden (positiv = Batterie lädt)
      #
      # AKTIVER DEFAULT: SMA (2 separate Sensoren für Laden/Entladen, beide >= 0)
      #   battery_power = charge - discharge  →  positiv = laden
      #   Debug-Attribut zeigt an, ob gleichzeitig geladen und entladen wird.
      #
      # ALTERNATIVE (Huawei / Einzel-Sensor, auskommentiert):
      #   Manche WR liefern einen einzigen signierten Sensor.
      #   Konvention muss +=laden sein:
      #     Quelle positiv = laden  → direkt übernehmen
      #     Quelle positiv = entladen → * -1 (Vorzeichen drehen)
      # -----------------------------------------------------------------------
      - unique_id: opti_mapping_battery_power_w
        name: "Opti Battery Power W"
        unit_of_measurement: "W"
        state_class: measurement
        # SMA: beide Quellen müssen verfügbar sein
        availability: >
          {{ has_value('sensor.DEIN_CHARGE_W') and has_value('sensor.DEIN_DISCHARGE_W') }}
        # SMA: Netto-Ladeleistung = Laden minus Entladen (positiv = laden)
        state: >
          {{ states('sensor.DEIN_CHARGE_W') | float(0) - states('sensor.DEIN_DISCHARGE_W') | float(0) }}
        attributes:
          simultaneous_charge_discharge: >
            {{ states('sensor.DEIN_CHARGE_W') | float(0) > 0 and
               states('sensor.DEIN_DISCHARGE_W') | float(0) > 0 }}
        # --- ALTERNATIVE: Huawei / Einzel-Sensor ---
        # (diese 3 Zeilen einkommentieren und den SMA-Block oben auskommentieren)
        # availability: "{{ has_value('sensor.DEIN_BATT_POWER') }}"
        # state: "{{ states('sensor.DEIN_BATT_POWER') | float(0) }}"
        # Falls Quelle positiv = entladen (Laden ist negativ) → Vorzeichen drehen:
        # state: "{{ states('sensor.DEIN_BATT_POWER') | float(0) * -1 }}"

      # -----------------------------------------------------------------------
      # 14. OPTIONAL - Kennzahlen fuer die KI-Analyse-Schicht (Phase 1).
      # Alle Eintraege optional: Block weglassen oder Quelle leer lassen ->
      # Sensor bleibt unavailable, der Tagesreport markiert die Kennzahl als
      # "nicht verfuegbar". KEINE Steuerungsfunktion.
      # -----------------------------------------------------------------------

      # Kumulierte Batterie-Ladung (kWh, monoton steigend, z. B. WR-Total)
      - unique_id: opti_mapping_battery_charge_total
        name: "Opti Battery Charge Total kWh"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.DEIN_AKKU_LADUNG_TOTAL') }}"
        state: "{{ states('sensor.DEIN_AKKU_LADUNG_TOTAL') | float(0) }}"

      # Kumulierte Batterie-Entladung (kWh, monoton steigend)
      - unique_id: opti_mapping_battery_discharge_total
        name: "Opti Battery Discharge Total kWh"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.DEIN_AKKU_ENTLADUNG_TOTAL') }}"
        state: "{{ states('sensor.DEIN_AKKU_ENTLADUNG_TOTAL') | float(0) }}"

      # Preisspanne heute (ct/kWh, max - min des Tages)
      - unique_id: opti_mapping_price_spread_today
        name: "Opti Price Spread Today ct"
        unit_of_measurement: "ct/kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.DEINE_PREISSPANNE_HEUTE') }}"
        state: "{{ states('sensor.DEINE_PREISSPANNE_HEUTE') | float(0) }}"

      # Netzbezug heute (kWh)
      - unique_id: opti_mapping_grid_import_today
        name: "Opti Grid Import Today kWh"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.DEIN_NETZBEZUG_HEUTE') }}"
        state: "{{ states('sensor.DEIN_NETZBEZUG_HEUTE') | float(0) }}"

      # PV-Ertrag heute (kWh, Ist-Erzeugung fuer Forecast-vs-Ist).
      # Bei mehreren Wechselrichtern muss diese Quelle bereits deren GESAMTEN
      # Tagesertrag liefern. Tagesaggregate mit zeitversetzten Quell-Resets
      # bekommen hier bewusst keine state_class: total_increasing.
      - unique_id: opti_mapping_pv_yield_today
        name: "Opti PV Yield Today kWh"
        unit_of_measurement: "kWh"
        device_class: energy
        availability: "{{ has_value('sensor.DEIN_PV_ERTRAG_HEUTE_GESAMT') }}"
        state: "{{ states('sensor.DEIN_PV_ERTRAG_HEUTE_GESAMT') | float(0) }}"

  # ---------------------------------------------------------------------------
  # OPTIONAL: EV-Ladepunkte (evcc via HACS-Integration evcc_intg).
  # Nur noetig fuer die EV-Schnelllade-Entladesperre (packages/opti_ev_sperre.yaml).
  # Ohne evcc: Block weglassen - die Sperre bleibt dann dauerhaft inaktiv.
  # Ein Ladepunkt mit invaliden Quelldaten wird unavailable (NICHT off), damit
  # die Aggregation Invaliditaet von "laedt nicht" unterscheiden kann.
  # Nur ein Ladepunkt? Zweiten Sensor trotzdem anlegen und die Quellen des
  # ersten eintragen (oder die Aggregation in opti_ev_sperre.yaml anpassen).
  # ---------------------------------------------------------------------------
  - binary_sensor:

      # 14. EV-Ladepunkt 1: Schnellladung aktiv (Modus now/minpv + laedt)
      - unique_id: opti_mapping_ev_lp1_schnell
        name: "Opti EV LP1 Schnell"
        icon: mdi:ev-station
        availability: >-
          {{ has_value('select.DEIN_EVCC_LP1_MODE')
             and has_value('binary_sensor.DEIN_EVCC_LP1_CHARGING') }}
        state: >-
          {{ is_state('binary_sensor.DEIN_EVCC_LP1_CHARGING', 'on')
             and states('select.DEIN_EVCC_LP1_MODE') in ['now', 'minpv'] }}
        attributes:
          modus: "{{ states('select.DEIN_EVCC_LP1_MODE') }}"
          charging: "{{ states('binary_sensor.DEIN_EVCC_LP1_CHARGING') }}"
          leistung_kw: "{{ states('sensor.DEIN_EVCC_LP1_CHARGE_POWER') | float(none) }}"
          valide: >-
            {{ has_value('select.DEIN_EVCC_LP1_MODE')
               and has_value('binary_sensor.DEIN_EVCC_LP1_CHARGING') }}

      # 15. EV-Ladepunkt 2: analog Ladepunkt 1
      - unique_id: opti_mapping_ev_lp2_schnell
        name: "Opti EV LP2 Schnell"
        icon: mdi:ev-station
        availability: >-
          {{ has_value('select.DEIN_EVCC_LP2_MODE')
             and has_value('binary_sensor.DEIN_EVCC_LP2_CHARGING') }}
        state: >-
          {{ is_state('binary_sensor.DEIN_EVCC_LP2_CHARGING', 'on')
             and states('select.DEIN_EVCC_LP2_MODE') in ['now', 'minpv'] }}
        attributes:
          modus: "{{ states('select.DEIN_EVCC_LP2_MODE') }}"
          charging: "{{ states('binary_sensor.DEIN_EVCC_LP2_CHARGING') }}"
          leistung_kw: "{{ states('sensor.DEIN_EVCC_LP2_CHARGE_POWER') | float(none) }}"
          valide: >-
            {{ has_value('select.DEIN_EVCC_LP2_MODE')
               and has_value('binary_sensor.DEIN_EVCC_LP2_CHARGING') }}
