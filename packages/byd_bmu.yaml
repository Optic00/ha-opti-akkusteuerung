# ---------------------------------------------------------------------------
# Abgeleitet: Zell-Spreizung in mV (max - min ueber den ganzen Turm).
# DIE Kernmetrik fuer bedarfsgesteuertes Balancing.
# ---------------------------------------------------------------------------
template:
  - sensor:
      # Min/Max kommen als getrennte MQTT-Topics ~60 s versetzt an - kurz nach
      # einem Update kann max-min deshalb verzerrt oder sogar negativ sein
      # (Artefakt, kein Zellzustand). Negative Werte werden auf 0 geklemmt;
      # gegen die positiven Transienten schuetzen die Ruhe-/SoC-Gates des
      # Ruhe-Sensors und die for:-Haltezeiten der Alarme.
      - unique_id: byd_bmu_zellspreizung_mv
        name: "BYD Zellspreizung"
        unit_of_measurement: "mV"
        state_class: measurement
        icon: mdi:arrow-expand-vertical
        availability: >
          {{ has_value('sensor.byd_zellspannung_max') and has_value('sensor.byd_zellspannung_min') }}
        state: >
          {{ [0, ((states('sensor.byd_zellspannung_max')|float(0) - states('sensor.byd_zellspannung_min')|float(0)) * 1000) | round(0)] | max }}

      # Temperatur-Spreizung ueber alle 5 Module (max Zelltemp - min Zelltemp).
      # Dauerhaft >10 K = ein Modul weicht ab (Kuehlung/Kontakt/Zelle pruefen).
      - unique_id: byd_bmu_temp_spreizung_k
        name: "BYD Temperatur-Spreizung"
        unit_of_measurement: "K"
        state_class: measurement
        icon: mdi:thermometer-alert
        availability: >
          {{ has_value('sensor.byd_modul_1_temp_max') and has_value('sensor.byd_modul_5_temp_max') }}
        state: >
          {% set tmax = [states('sensor.byd_modul_1_temp_max')|float(0), states('sensor.byd_modul_2_temp_max')|float(0),
                         states('sensor.byd_modul_3_temp_max')|float(0), states('sensor.byd_modul_4_temp_max')|float(0),
                         states('sensor.byd_modul_5_temp_max')|float(0)] | max %}
          {% set tmin = [states('sensor.byd_modul_1_temp_min')|float(99), states('sensor.byd_modul_2_temp_min')|float(99),
                         states('sensor.byd_modul_3_temp_min')|float(99), states('sensor.byd_modul_4_temp_min')|float(99),
                         states('sensor.byd_modul_5_temp_min')|float(99)] | min %}
          {{ (tmax - tmin) | round(0) }}

      # Modul-2 Fruehwarnung: Nettoenergie seit dem letzten Voll-Anker
      # (entladen - geladen, kWh). Kann bei PV-Ueberschussladung zwischen
      # Ankern sinken - deshalb measurement statt total_increasing.
      # Details: docs/byd-modul2-fruehwarnung-plan.md (Task 3).
      - unique_id: byd_netto_energie_seit_voll
        name: "BYD Nettoenergie seit Voll"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement          # NICHT total_increasing (darf bei PV-Ladung sinken)
        icon: mdi:battery-minus-outline
        availability: >
          {{ has_value('sensor.byd_entladen_seit_voll') and has_value('sensor.byd_geladen_seit_voll') }}
        state: >
          {{ (states('sensor.byd_entladen_seit_voll')|float
              - states('sensor.byd_geladen_seit_voll')|float) | round(3) }}

  # ---------------------------------------------------------------------------
  # Ruhe-Spreizung: aktualisiert NUR, wenn der Akku (nahezu) lastfrei ist
  # (|Leistung| < 300 W) UND der SoC im flachen Teil der LFP-Kennlinie liegt
  # (15-85 %). Unter Last steigt die Spreizung durch Innenwiderstands-
  # Unterschiede, am oberen/unteren Kennlinien-Knie (Ladeschluss/Tiefentladung)
  # laeuft sie kennlinienbedingt hoch (beobachtet 11.7.: 292 mV bei SoC 99 %,
  # 1-4 mV bei Mittel-SoC) - beides ist nicht vergleichbar. Erst dieser
  # gefilterte Sensor macht Wochen-Trends und den spaeteren Bedarfs-Balancing-
  # Trigger moeglich. Haelt zwischen Ruhephasen den letzten Wert (RestoreEntity).
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.byd_zellspreizung
    conditions:
      - condition: numeric_state
        entity_id: sensor.byd_leistung
        above: -300
        below: 300
      - condition: numeric_state
        entity_id: sensor.byd_soc
        above: 15
        below: 85
      - condition: template
        value_template: "{{ has_value('sensor.byd_zellspreizung') }}"
    sensor:
      - unique_id: byd_bmu_zellspreizung_ruhe_mv
        name: "BYD Zellspreizung Ruhe"
        unit_of_measurement: "mV"
        state_class: measurement
        icon: mdi:arrow-collapse-vertical
        state: "{{ states('sensor.byd_zellspreizung') }}"
        attributes:
          soc: "{{ states('sensor.byd_soc') }}"
          leistung_w: "{{ states('sensor.byd_leistung') }}"
          gemessen: "{{ now().isoformat() }}"

# ---------------------------------------------------------------------------
# Modul-2 Fruehwarnung: Frische- und Entladeband-Guards fuer die Knie-
# Statemachine. Details: docs/byd-modul2-fruehwarnung-plan.md (Task 2).
# ---------------------------------------------------------------------------
  - binary_sensor:
      - unique_id: byd_daten_frisch
        name: "BYD Daten frisch"
        device_class: connectivity
        icon: mdi:database-check
        state: >
          {{ has_value('sensor.byd_soc') and has_value('sensor.byd_leistung')
             and has_value('sensor.byd_modul_1_zellspannung_min')
             and has_value('sensor.byd_modul_2_zellspannung_min')
             and has_value('sensor.byd_modul_3_zellspannung_min')
             and has_value('sensor.byd_modul_4_zellspannung_min')
             and has_value('sensor.byd_modul_5_zellspannung_min')
             and has_value('sensor.byd_geladen_seit_voll')
             and has_value('sensor.byd_entladen_seit_voll') }}
      - unique_id: byd_entladeband
        name: "BYD Entladeband"
        icon: mdi:speedometer-slow
        state: >
          {% set p = states('sensor.byd_leistung')|float(0) %}
          {{ has_value('sensor.byd_leistung') and 500 <= p <= 1500 }}

# ---------------------------------------------------------------------------
# Modul-2 Fruehwarnung: Sensor A - relative Zell-Absackung (mV, Peer-Median
# der 4 Nachbarmodule ggue. Modul 2). Details: docs/byd-modul2-fruehwarnung-plan.md (Task 4).
# ---------------------------------------------------------------------------
  - sensor:
      - unique_id: byd_modul2_absackung
        name: "BYD Modul-2 Absackung"
        unit_of_measurement: "mV"
        state_class: measurement
        icon: mdi:arrow-down-bold-box
        availability: "{{ is_state('binary_sensor.byd_daten_frisch','on') }}"
        state: >
          {% set peers = [states('sensor.byd_modul_1_zellspannung_min')|float,
                          states('sensor.byd_modul_3_zellspannung_min')|float,
                          states('sensor.byd_modul_4_zellspannung_min')|float,
                          states('sensor.byd_modul_5_zellspannung_min')|float] | sort %}
          {% set peer_median = (peers[1] + peers[2]) / 2 %}
          {% set m2 = states('sensor.byd_modul_2_zellspannung_min')|float %}
          {{ ((peer_median - m2) * 1000) | round(1) }}
        attributes:
          soc: "{{ states('sensor.byd_soc') }}"
          leistung_w: "{{ states('sensor.byd_leistung') }}"
          modul2_volt: "{{ states('sensor.byd_modul_2_zellspannung_min') }}"
          peer_median_volt: >
            {% set peers = [states('sensor.byd_modul_1_zellspannung_min')|float,
                            states('sensor.byd_modul_3_zellspannung_min')|float,
                            states('sensor.byd_modul_4_zellspannung_min')|float,
                            states('sensor.byd_modul_5_zellspannung_min')|float] | sort %}
            {{ ((peers[1] + peers[2]) / 2) | round(3) }}
          schwaechstes_modul: >
            {% set ns = namespace(min_v=99, idx='?') %}
            {% for i in [1,2,3,4,5] %}
              {% set v = states('sensor.byd_modul_' ~ i ~ '_zellspannung_min')|float(99) %}
              {% if v < ns.min_v %}{% set ns.min_v = v %}{% set ns.idx = i|string %}{% endif %}
            {% endfor %}
            {{ ns.idx }}

# ---------------------------------------------------------------------------
# Modul-2 Fruehwarnung: Latch-Sensor - snapshottet die Nettoenergie seit Voll
# (und Begleitwerte) im Moment, in dem der Knie-Zyklus-Status nach "latched"
# wechselt. Details: docs/byd-modul2-fruehwarnung-plan.md (Task 5).
# ---------------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: input_select.byd_knie_zyklus_status
        to: "latched"
    sensor:
      - unique_id: byd_modul2_netto_bis_knie
        name: "BYD Modul-2 Nettoenergie bis Knie"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-alert-variant-outline
        state: "{{ states('sensor.byd_netto_energie_seit_voll') }}"
        attributes:
          netto_kwh: "{{ states('sensor.byd_netto_energie_seit_voll') }}"
          geladen_inkrement_kwh: "{{ states('sensor.byd_geladen_seit_voll') }}"
          entladen_inkrement_kwh: "{{ states('sensor.byd_entladen_seit_voll') }}"
          a_absackung_mv: "{{ states('sensor.byd_modul2_absackung') }}"
          soc: "{{ states('sensor.byd_soc') }}"
          leistung_w: "{{ states('sensor.byd_leistung') }}"
          modul2_volt: "{{ states('sensor.byd_modul_2_zellspannung_min') }}"
          modul_temp_c: "{{ states('sensor.byd_modul_2_temp_max') }}"
          ref_verwendet_v: "{{ states('input_number.byd_knie_ref_frozen') }}"
          cycle_id: "{{ states('input_text.byd_knie_cycle_id') }}"
          sauberer_zyklus: "{{ states('sensor.byd_geladen_seit_voll')|float(0) < 0.5 }}"
          gemessen: "{{ now().isoformat() }}"

# ---------------------------------------------------------------------------
# Alarme: deterministische Gesundheits-Alarme aus den BMU-Daten.
# Schwellen liegen bewusst VOR den BMS-Schutzgrenzen (2,75/3,65 V).
#
# SoC-Gating (Befund 2026-07-11): Am Ladeschluss (SoC >= 90 %, LFP-Kennlinien-
# Knie, Balancing aktiv) laufen Max-Zellspannung und Spreizung kurzzeitig hoch
# (beobachtet: 3,659 V Peak bei 0 W Ladeleistung) - das ist top-of-charge-
# normal und feuert sonst bei JEDER Vollladung (der Balancing-Watchdog
# erzwingt regelmaessige Vollladungen). Deshalb:
#   - zell_hoch/zell_kritisch gelten nur bei SoC < 90 % (dort sind sie eine
#     echte Anomalie).
#   - Bei hohem SoC alarmiert nur noch zell_bms_grenze: >3,65 V ueber 5 min
#     anhaltend = das BMS kappt nicht -> immer kritisch, egal welcher SoC.
#
# Live-Abweichung (dokumentiert): notify.notify wird live durch den echten
# Mobile-App-Service ersetzt; script.ki_alarm_kontext (KI-Lagebild) existiert
# nur live - der Aufruf ist mit continue_on_error abgesichert.
# ---------------------------------------------------------------------------
automation:
  - id: byd_akku_gesundheit_alarme
    alias: "BYD | Akku-Gesundheit Alarme"
    description: >-
      Deterministische Alarme aus den BMU-Daten (bydlogc via MQTT): Zellspannung
      absolut (SoC-gegated, plus BMS-Grenzwaechter), Zelltemperatur, Temperatur-
      Spreizung zwischen Modulen, persistierende Ruhe-Spreizung, Daten-Staleness
      (Logger tot). Schwellen liegen bewusst VOR den BMS-Schutzgrenzen (2,75/3,65 V).
    mode: queued
    max: 5
    triggers:
      - trigger: numeric_state
        id: zell_hoch
        entity_id: sensor.byd_zellspannung_max
        above: 3.55
        for: "00:02:00"
      - trigger: numeric_state
        id: zell_kritisch
        entity_id: sensor.byd_zellspannung_max
        above: 3.6
        for: "00:00:30"
      - trigger: numeric_state
        id: zell_bms_grenze
        entity_id: sensor.byd_zellspannung_max
        above: 3.65
        for: "00:05:00"
      - trigger: numeric_state
        id: zell_niedrig
        entity_id: sensor.byd_zellspannung_min
        below: 2.9
        for: "00:05:00"
      - trigger: numeric_state
        id: temp_hoch
        entity_id:
          - sensor.byd_modul_1_temp_max
          - sensor.byd_modul_2_temp_max
          - sensor.byd_modul_3_temp_max
          - sensor.byd_modul_4_temp_max
          - sensor.byd_modul_5_temp_max
        above: 45
        for: "00:05:00"
      - trigger: numeric_state
        id: temp_kritisch
        entity_id:
          - sensor.byd_modul_1_temp_max
          - sensor.byd_modul_2_temp_max
          - sensor.byd_modul_3_temp_max
          - sensor.byd_modul_4_temp_max
          - sensor.byd_modul_5_temp_max
        above: 50
        for: "00:01:00"
      - trigger: numeric_state
        id: temp_delta
        entity_id: sensor.byd_temperatur_spreizung
        above: 10
        for: "00:15:00"
      - trigger: numeric_state
        id: ruhe_spreizung
        entity_id: sensor.byd_zellspreizung_ruhe
        above: 50
        for: "01:00:00"
      - trigger: state
        id: stale
        entity_id: sensor.byd_soc
        to:
          - "unavailable"
          - "unknown"
        for: "00:15:00"
    conditions:
      # SoC-Gate NUR fuer zell_hoch/zell_kritisch (siehe Kopfkommentar).
      # Alle anderen Regeln (inkl. zell_bms_grenze) laufen ungefiltert.
      - condition: or
        conditions:
          - condition: trigger
            id:
              - zell_bms_grenze
              - zell_niedrig
              - temp_hoch
              - temp_kritisch
              - temp_delta
              - ruhe_spreizung
              - stale
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - zell_hoch
                  - zell_kritisch
              - condition: numeric_state
                entity_id: sensor.byd_soc
                below: 90
    actions:
      - alias: "Alarmtext je Regel"
        variables:
          alarm_text: >-
            {% set t = {
              'zell_hoch': 'Zellspannung hoch: ' ~ states('sensor.byd_zellspannung_max') ~ ' V (>3,55 V seit 2 min bei SoC ' ~ states('sensor.byd_soc') ~ ' % - unter 90 % eine echte Anomalie). Ladeleistung beobachten/drosseln.',
              'zell_kritisch': 'Zellspannung KRITISCH: ' ~ states('sensor.byd_zellspannung_max') ~ ' V (>3,60 V bei SoC ' ~ states('sensor.byd_soc') ~ ' % - unter 90 %!) - Laden sofort stoppen/pruefen!',
              'zell_bms_grenze': 'Zellspannung UEBER BMS-GRENZE: ' ~ states('sensor.byd_zellspannung_max') ~ ' V (>3,65 V seit 5 min anhaltend - das BMS kappt nicht!) - sofort pruefen!',
              'zell_niedrig': 'Zellspannung niedrig: ' ~ states('sensor.byd_zellspannung_min') ~ ' V (<2,90 V seit 5 min). Entladung beobachten.',
              'temp_hoch': 'Zelltemperatur hoch: ' ~ trigger.to_state.state ~ ' C (>45 C, ' ~ trigger.to_state.name ~ ').',
              'temp_kritisch': 'Zelltemperatur KRITISCH: ' ~ trigger.to_state.state ~ ' C (>50 C, ' ~ trigger.to_state.name ~ ') - sofort pruefen!',
              'temp_delta': 'Temperatur-Spreizung zwischen Modulen: ' ~ states('sensor.byd_temperatur_spreizung') ~ ' K (>10 K seit 15 min) - ein Modul weicht ab.',
              'ruhe_spreizung': 'Zellspreizung in Ruhe dauerhaft hoch: ' ~ states('sensor.byd_zellspreizung_ruhe') ~ ' mV (>50 mV seit 1 h, gemessen im flachen Kennlinienbereich) - Balancing-Bedarf pruefen.',
              'stale': 'Keine BYD-BMU-Daten seit >15 min - bydlogc-Container/MQTT-Strecke pruefen.'
            } %}{{ t.get(trigger.id, 'BYD-Alarm: ' ~ trigger.id) }}
      - alias: "Push"
        choose:
          - conditions:
              - condition: trigger
                id:
                  - zell_kritisch
                  - zell_bms_grenze
                  - temp_kritisch
            sequence:
              - action: notify.notify
                data:
                  title: "🔋🚨 BYD Akku-Alarm"
                  message: "{{ alarm_text }}"
                  data:
                    push:
                      sound:
                        name: default
                        critical: 1
                        volume: 1
        default:
          - action: notify.notify
            data:
              title: "🔋 BYD Akku-Alarm"
              message: "{{ alarm_text }}"
      - alias: "KI-Lagebild anstossen (fire-and-forget, Skript existiert nur live)"
        action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.ki_alarm_kontext
        data:
          variables:
            alarm_titel: "BYD Akku-Alarm"
            hinweis: >-
              BYD Battery-Box Premium HVS (LFP, 5 Module, 12,8 kWh) am SMA WR.
              Datenquelle: bydlogc via MQTT (Abtastung ~60 s). BMS-Schutzgrenzen
              2,75/3,65 V - die Alarme liegen bewusst davor. Zellspannungs-Alarme
              sind SoC-gegated (<90 %), am Ladeschluss zaehlt nur die BMS-Grenze.
              Zellspreizung ist nur in Ruhe und bei SoC 15-85 % vergleichbar.
            daten: >-
              Ausgeloest durch Regel: {{ trigger.id }}
              {{ alarm_text }}

              Zellspannung min/max: {{ states('sensor.byd_zellspannung_min') }} / {{ states('sensor.byd_zellspannung_max') }} V
              Zellspreizung: {{ states('sensor.byd_zellspreizung') }} mV (Ruhe: {{ states('sensor.byd_zellspreizung_ruhe') }} mV)
              SoC: {{ states('sensor.byd_soc') }} %, Leistung: {{ states('sensor.byd_leistung') }} W
              Modul-Temp max (1-5): {{ states('sensor.byd_modul_1_temp_max') }} / {{ states('sensor.byd_modul_2_temp_max') }} / {{ states('sensor.byd_modul_3_temp_max') }} / {{ states('sensor.byd_modul_4_temp_max') }} / {{ states('sensor.byd_modul_5_temp_max') }} C
              Temperatur-Spreizung: {{ states('sensor.byd_temperatur_spreizung') }} K
              Balancing aktiv: {{ states('binary_sensor.byd_balancing_aktiv') }}
              Steuerungs-Modus: {{ states('input_select.akkusteuerung_modus') }}

  - id: byd_top_erreicht_merker
    alias: "BYD | Ladeschluss-Merker setzen"
    description: "Merkt sich, dass im laufenden Ladevorgang die Ladeschluss-Zellspannung erreicht wurde (Voll-Anker-Evidenz)."
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.byd_zellspannung_max
        above: 3.55
        for: "00:02:00"
    conditions: []
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.byd_top_erreicht }

  - id: byd_voll_anker
    alias: "BYD | Voll-Anker (Ladeabschluss)"
    description: >-
      Ladeabschluss-Event: Zellmax war >=3,55 V (Merker), danach Ladeende
      (Leistung > -300 W = nicht mehr nennenswert Laden) fuer 5 min. Setzt den
      Knie-Zyklus neu auf. Re-Arm-Sperre: nur wenn idle ODER seit letztem Anker
      >=0,5 kWh netto entnommen (verhindert Mehrfach-Reset im Ladeschluss-Flattern).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.byd_leistung
        above: -300
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: input_boolean.byd_top_erreicht
        state: "on"
      - condition: numeric_state
        entity_id: sensor.byd_soc
        above: 94
      - condition: state
        entity_id: binary_sensor.byd_daten_frisch
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('input_select.byd_knie_zyklus_status','idle')
             or states('sensor.byd_netto_energie_seit_voll')|float(0) >= 0.5 }}
    actions:
      - action: utility_meter.reset
        target:
          entity_id:
            - sensor.byd_geladen_seit_voll
            - sensor.byd_entladen_seit_voll
      - action: input_number.set_value
        target: { entity_id: input_number.byd_knie_ref_frozen }
        data:
          value: "{{ states('input_number.byd_knie_referenzspannung')|float(3.20) }}"
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.byd_knie_ueberschwelle_gesehen }
      - action: input_text.set_value
        target: { entity_id: input_text.byd_knie_cycle_id }
        data: { value: "{{ now().isoformat() }}" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.byd_voll_anker_zeit }
        data: { datetime: "{{ now().isoformat() }}" }
      - action: input_select.select_option
        target: { entity_id: input_select.byd_knie_zyklus_status }
        data: { option: "armed" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.byd_knie_armed }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.byd_top_erreicht }

  - id: byd_knie_ueberschwelle_gesehen
    alias: "BYD | Knie Ueberschwelle gesehen"
    description: "Setzt das Guard-Flag, sobald Modul-2-min seit dem Anker klar (>= ref+30 mV) oberhalb der Schwelle war."
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ states('sensor.byd_modul_2_zellspannung_min')|float(0)
             > states('input_number.byd_knie_ref_frozen')|float(3.20) + 0.03 }}
    conditions:
      - condition: state
        entity_id: input_boolean.byd_knie_armed
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.byd_knie_ueberschwelle_gesehen }

  - id: byd_knie_latch
    alias: "BYD | Knie-Latch (Nettoenergie festhalten)"
    description: >-
      Latcht, wenn Modul-2-min zum ersten Mal seit Voll die eingefrorene Referenz
      (Default 3,20 V) 3 min lang unterschreitet, im standardisierten Entladeband
      (+500..1500 W ueber die Haltezeit), bei frischen Daten und gesehener Ueberschwelle.
      Die 3-min-Haltezeit ersetzt eine explizite mV-Hysterese (starke Entprellung).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.byd_modul_2_zellspannung_min
        below: input_number.byd_knie_ref_frozen
        for: "00:03:00"
    conditions:
      - condition: state
        entity_id: input_select.byd_knie_zyklus_status
        state: "armed"
      - condition: state
        entity_id: input_boolean.byd_knie_ueberschwelle_gesehen
        state: "on"
      - condition: state
        entity_id: binary_sensor.byd_entladeband
        state: "on"
        for: "00:03:00"
      - condition: state
        entity_id: binary_sensor.byd_daten_frisch
        state: "on"
      - condition: template
        value_template: "{{ has_value('sensor.byd_netto_energie_seit_voll') }}"
    actions:
      - action: input_select.select_option
        target: { entity_id: input_select.byd_knie_zyklus_status }
        data: { option: "latched" }        # der Latch-Sensor (Task 5) snapshottet hierauf
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.byd_knie_armed }

  - id: byd_knie_invalid
    alias: "BYD | Knie-Zyklus ungueltig markieren"
    description: >-
      Markiert den laufenden armed-Zyklus als invalid bei Mess-Qualitaetsproblemen:
      Datenluecke nahe Knie, Neustart nahe Knie, unplausibler Netto-Sprung.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        id: datenluecke
        entity_id: binary_sensor.byd_daten_frisch
        to: "off"
        for: "00:02:00"
      - trigger: homeassistant
        id: neustart
        event: start
      - trigger: state
        id: zaehlersprung
        entity_id: sensor.byd_netto_energie_seit_voll
    conditions:
      - condition: state
        entity_id: input_select.byd_knie_zyklus_status
        state: "armed"
      - condition: or
        conditions:
          # Datenluecke oder Neustart nur relevant, wenn Modul-2 nahe/unter Schwelle (Knie-Kandidat)
          - condition: and
            conditions:
              - condition: trigger
                id: ["datenluecke", "neustart"]
              - condition: template
                value_template: >
                  {{ states('sensor.byd_modul_2_zellspannung_min')|float(9)
                     <= states('input_number.byd_knie_ref_frozen')|float(3.20) + 0.01 }}
          # Unplausibler Sprung: Netto-Aenderung > 3 kWh in einem Schritt (bei 60 s physikalisch unmoeglich)
          - condition: template
            value_template: >
              {{ trigger.id == 'zaehlersprung'
                 and trigger.from_state is not none and trigger.to_state is not none
                 and trigger.from_state.state not in ['unknown','unavailable']
                 and trigger.to_state.state not in ['unknown','unavailable']
                 and (trigger.to_state.state|float - trigger.from_state.state|float)|abs > 3 }}
    actions:
      - action: input_select.select_option
        target: { entity_id: input_select.byd_knie_zyklus_status }
        data: { option: "invalid" }
      - action: input_text.set_value
        target: { entity_id: input_text.byd_knie_invalid_grund }
        data: { value: "{{ trigger.id }} @ {{ now().strftime('%Y-%m-%d %H:%M') }}" }

# ---------------------------------------------------------------------------
# Modul-2 Fruehwarnung: Helfer fuer den Knie-Zyklus-Statemachine
# (idle -> armed -> latched, jederzeit -> invalid). Details: docs/byd-modul2-fruehwarnung-plan.md
# ---------------------------------------------------------------------------
input_number:
  byd_knie_referenzspannung:
    name: "BYD Knie-Referenzspannung"
    min: 3.05
    max: 3.35
    step: 0.005
    initial: 3.20          # nur beim allerersten Start; danach restore
    unit_of_measurement: "V"
    mode: box
    icon: mdi:sine-wave
  byd_knie_ref_frozen:
    name: "BYD Knie-Referenz (eingefroren)"
    min: 3.05
    max: 3.35
    step: 0.001
    initial: 3.20
    unit_of_measurement: "V"
    mode: box
    icon: mdi:snowflake

input_boolean:
  byd_knie_armed:
    name: "BYD Knie scharf"
    icon: mdi:target
  byd_knie_ueberschwelle_gesehen:
    name: "BYD Knie Ueberschwelle gesehen"
    icon: mdi:arrow-up-bold
  byd_top_erreicht:
    name: "BYD Ladeschluss erreicht"
    icon: mdi:arrow-collapse-up

input_select:
  byd_knie_zyklus_status:
    name: "BYD Knie Zyklus-Status"
    options: ["idle", "armed", "latched", "invalid"]
    initial: idle
    icon: mdi:state-machine

input_text:
  byd_knie_cycle_id:
    name: "BYD Knie Cycle-ID"
    max: 40
  byd_knie_invalid_grund:
    name: "BYD Knie Invalid-Grund"
    max: 120

input_datetime:
  byd_voll_anker_zeit:
    name: "BYD Voll-Anker Zeit"
    has_date: true
    has_time: true

# ---------------------------------------------------------------------------
# Modul-2 Fruehwarnung: Energie-Zaehler seit dem letzten Voll-Anker (Reset
# durch die Voll-Anker-Automation via utility_meter.reset). Quelle ist
# total_increasing, kein Zyklus-Reset noetig -> periodically_resetting: false.
# Details: docs/byd-modul2-fruehwarnung-plan.md (Task 3).
# ---------------------------------------------------------------------------
utility_meter:
  byd_geladen_seit_voll:
    source: sensor.byd_geladen_gesamt
    name: "BYD geladen seit Voll"
    periodically_resetting: false      # Quelle ist total_increasing, kein Zyklus-Reset
  byd_entladen_seit_voll:
    source: sensor.byd_entladen_gesamt
    name: "BYD entladen seit Voll"
    periodically_resetting: false
