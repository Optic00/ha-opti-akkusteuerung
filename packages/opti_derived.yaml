# =============================================================================
# opti_derived.yaml — Abgeleitete Opti-Entscheidungs-Sensoren (Paket 2)
# =============================================================================
# Diese Sensoren konsumieren AUSSCHLIESSLICH die Canonical-Mapping-Sensoren
# (sensor.opti_*) aus Paket 1, die input_number-Helfer und sun.sun.
# KEINE rohen Hardware-Refs (WR-Seriennummern, Preis-/Prognose-Rohsensoren etc.).
#
# Einheiten (verbindlich): Preise ct/kWh, Leistung W, Energie kWh.
# Vorzeichen: opti_grid_export_w >= 0 (Einspeisung); opti_battery_power_w += laden.
#
# Übersetzte Sensoren (target_soc / charge_power / price_level / runtime) bilden
# die Logik der SMA-Template-Quellsensoren 1:1 nach —
# nur die Quell-Entitäten wurden gegen die opti_*-Aliase getauscht. Schwellen
# und Stufen sind unverändert. Bewusste Ausnahme: opti_charge_power_w ersetzt die
# Forecast-Label-Verzweigung der Quelle durch opti_forecast_score-Bänder.
# =============================================================================

template:
  - binary_sensor:

      # -----------------------------------------------------------------------
      # 0. Wintermodus-/Winterladefreigabe (Gate) — fail-open
      #    Default ON. Solange kein optionaler Quell-Sensor (z. B. Sommermodus-
      #    Gate) gemappt ist, gilt true (Laden erlaubt). Wird in den Winter-/
      #    Prognose-Ladeblöcken der Strategie-Automation als Gate genutzt.
      # -----------------------------------------------------------------------
      - unique_id: opti_winter_charging_allowed
        name: "Opti Winter Charging Allowed"
        state: "{{ true }}"

      # -----------------------------------------------------------------------
      # 0a. Entprellte Überschuss-Signale (Anti-Flatter, 2026-07-03)
      #    Rohwert-Vergleiche (grid > g70, pv > gac) flatterten live im
      #    Minutentakt: das Export-Signal ist über den Akku rückgekoppelt
      #    (Laden drückt den Export unter die Grenze und beendet damit die
      #    eigene Freigabe). Diese Sensoren rechnen deshalb den Akku aus dem
      #    Signal heraus (Export bzw. WR-AC + Batterieleistung, Vorzeichen
      #    positiv = laden -> "Wert ohne Akku-Eingriff") und entprellen wie
      #    die alte Opti-2.0-Automatik mit 30 s beidseitig; dazu ein
      #    Hysterese-Band gegen Pendeln am Grenzwert. Quellen unavailable
      #    -> off (fail-safe: im Zweifel keine Lade-Freigabe).
      #    Policy-Gates (Toggle, Tag, SoC < 100) bleiben bewusst in
      #    Strategie/Vorschau - hier steht nur das physikalische Signal.
      # -----------------------------------------------------------------------
      - unique_id: opti_ueberschuss_70_aktiv
        name: "Opti Ueberschuss 70 Aktiv"
        icon: mdi:transmission-tower-export
        delay_on:
          seconds: 30
        delay_off:
          seconds: 30
        state: >
          {% set ok = has_value('sensor.opti_grid_export_w')
                      and has_value('sensor.opti_battery_power_w') %}
          {% set export_ohne_akku = [0, states('sensor.opti_grid_export_w')|float(0)
                                        + states('sensor.opti_battery_power_w')|float(0)] | max %}
          {% set ein = states('input_number.akkusteuerung_wr_70proz_ueberschuss_grenze')|float(999999) %}
          {% set aus = ein - 1000 %}
          {% set war_an = this is defined and this.state == 'on' %}
          {{ ok and (export_ohne_akku > ein
                     or (aus > 0 and export_ohne_akku >= aus and war_an)) }}
        attributes:
          export_ohne_akku_w: >
            {{ [0, states('sensor.opti_grid_export_w')|float(0)
                   + states('sensor.opti_battery_power_w')|float(0)] | max | round(0) }}
          grenze_ein_w: "{{ states('input_number.akkusteuerung_wr_70proz_ueberschuss_grenze') }}"
          hysterese_w: 1000

      - unique_id: opti_ueberschuss_ac_aktiv
        name: "Opti Ueberschuss AC Aktiv"
        icon: mdi:sine-wave
        delay_on:
          seconds: 30
        delay_off:
          seconds: 30
        state: >
          {% set ok = has_value('sensor.opti_pv_power_w')
                      and has_value('sensor.opti_battery_power_w') %}
          {% set ac_ohne_akku = [0, states('sensor.opti_pv_power_w')|float(0)
                                    + states('sensor.opti_battery_power_w')|float(0)] | max %}
          {% set ein = states('input_number.akkusteuerung_wr_ac_ueberschuss_grenze')|float(999999) %}
          {% set aus = ein - 300 %}
          {% set war_an = this is defined and this.state == 'on' %}
          {{ ok and (ac_ohne_akku > ein
                     or (aus > 0 and ac_ohne_akku >= aus and war_an)) }}
        attributes:
          ac_ohne_akku_w: >
            {{ [0, states('sensor.opti_pv_power_w')|float(0)
                   + states('sensor.opti_battery_power_w')|float(0)] | max | round(0) }}
          grenze_ein_w: "{{ states('input_number.akkusteuerung_wr_ac_ueberschuss_grenze') }}"
          hysterese_w: 300

  - sensor:

      # -----------------------------------------------------------------------
      # 1. Forecast Score heute (0-10) — PV-Fit-Bewertung des Resttages
      #    Abend-Fallback: nach dem heutigen Sonnenuntergang ist der Resttag
      #    praktisch 0 kWh und der Score wuerde jeden Abend auf 0 fallen.
      #    Ab dann zaehlt stattdessen der Morgen-Score (nachts laedt/spart
      #    man fuer morgen), falls dieser verfuegbar ist - sonst die alte
      #    Formel (best-effort, keine Availability-Kopplung an score_tomorrow).
      #    Verbrauch: nutzt den 60-min-Mittelwert (Legacy-Muster) statt des
      #    Momentanwerts, damit kurze Lastspitzen (z.B. Wasserkocher) den
      #    Score nicht minuetlich auf 0 kippen.
      #    P10: estimate10 kommt vom REST-Tag-Sensor (remaining_today), nicht
      #    vom Ganztags-Sensor - das Ganztags-P10 enthaelt die schon gelaufene
      #    Produktion und waere nachmittags kein Sicherheitsnetz mehr.
      #    Availability spiegelt die Zweige: der Abend-Zweig braucht nur den
      #    Morgen-Score, die Tages-Formel Rest-Prognose + Kapazitaet + SoC.
      # -----------------------------------------------------------------------
      - unique_id: opti_forecast_score
        name: "Opti Forecast Score"
        state_class: measurement
        availability: >
          {% set setting = state_attr('sun.sun', 'next_setting') %}
          {% set nach_sunset = setting is not none and (setting | as_datetime | as_local).date() != now().date() %}
          {{ (nach_sunset and has_value('sensor.opti_forecast_score_tomorrow'))
             or (has_value('sensor.opti_forecast_remaining_today_kwh')
                 and has_value('sensor.opti_forecast_effective_remaining_kwh')
                 and has_value('sensor.opti_battery_capacity_kwh')
                 and has_value('sensor.opti_soc')) }}
        state: >
          {% set setting = state_attr('sun.sun', 'next_setting') %}
          {% set nach_sunset = setting is not none and (setting | as_datetime | as_local).date() != now().date() %}
          {% if nach_sunset and has_value('sensor.opti_forecast_score_tomorrow') %}
          {{ states('sensor.opti_forecast_score_tomorrow') | int(0) }}
          {% else %}
          {% set remaining = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
          {% set cap = states('sensor.opti_battery_capacity_kwh') | float(0) %}
          {% set needed = cap * (1 - (states('sensor.opti_soc') | float(0))/100) %}
          {% set sunset = state_attr('sun.sun','next_setting') %}
          {% set h = ((sunset | as_datetime - now()).total_seconds()/3600) if sunset else 0 %}
          {% set hausverbrauch = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(400)) %}
          {% set verbrauch = hausverbrauch / 1000 * ([h,0]|max) %}
          {% set surplus = [remaining - verbrauch, 0] | max %}
          {% if h <= 0 %}0{% elif needed <= 0 %}10
          {% else %}{{ (([surplus / needed, 1]|min) * 10) | round(0) | int }}{% endif %}
          {% endif %}
        attributes:
          remaining_kwh: >
            {{ states('sensor.opti_forecast_effective_remaining_kwh') | float(0) | round(2) }}
          needed_full_kwh: "{{ (states('sensor.opti_battery_capacity_kwh')|float(0) * (1-(states('sensor.opti_soc')|float(0))/100))|round(2) }}"
          hours_to_sunset: "{{ (((state_attr('sun.sun','next_setting')|as_datetime - now()).total_seconds()/3600) if state_attr('sun.sun','next_setting') else 0)|round(1) }}"
          pv_surplus_kwh: >
            {% set rem = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set sunset = state_attr('sun.sun','next_setting') %}
            {% set h = ((sunset|as_datetime - now()).total_seconds()/3600) if sunset else 0 %}
            {% set hausverbrauch = states('sensor.opti_house_consumption_60min_w')|float(states('sensor.opti_house_consumption_w')|float(400)) %}
            {{ [rem - (hausverbrauch/1000*([h,0]|max)), 0]|max|round(2) }}
          ueberschuss_ueber_voll_kwh: >
            {% set rem = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set sunset = state_attr('sun.sun','next_setting') %}
            {% set h = ((sunset|as_datetime - now()).total_seconds()/3600) if sunset else 0 %}
            {% set hausverbrauch = states('sensor.opti_house_consumption_60min_w')|float(states('sensor.opti_house_consumption_w')|float(400)) %}
            {% set surplus = [rem - (hausverbrauch/1000*([h,0]|max)),0]|max %}
            {% set needed = states('sensor.opti_battery_capacity_kwh')|float(0)*(1-(states('sensor.opti_soc')|float(0))/100) %}
            {{ [surplus - needed, 0]|max|round(2) }}
          reason: >
            {% set setting = state_attr('sun.sun', 'next_setting') %}
            {% set nach_sunset = setting is not none and (setting | as_datetime | as_local).date() != now().date() %}
            {{ 'Abend -> Morgen-Score' if (nach_sunset and has_value('sensor.opti_forecast_score_tomorrow')) else ('Nacht' if (state_attr('sun.sun','next_setting') is none) else ('Akku voll' if (states('sensor.opti_battery_capacity_kwh')|float(0)*(1-(states('sensor.opti_soc')|float(0))/100)) <= 0 else 'PV-Fit')) }}

      # -----------------------------------------------------------------------
      # 2. Forecast Score morgen (0-10) — PV-Fit der Morgen-Prognose
      #    Verbrauch: 60-min-Mittelwert (Legacy-Muster) statt Momentanwert,
      #    Glaettung gegen Lastspitzen wie beim Tages-Score.
      # -----------------------------------------------------------------------
      - unique_id: opti_forecast_score_tomorrow
        name: "Opti Forecast Score Tomorrow"
        state_class: measurement
        availability: >
          {{ has_value('sensor.opti_forecast_tomorrow_kwh') and has_value('sensor.opti_house_consumption_w') }}
        state: >
          {% set hausverbrauch = states('sensor.opti_house_consumption_60min_w')|float(states('sensor.opti_house_consumption_w')|float(400)) %}
          {% set verbrauch_w = [hausverbrauch, 1]|max %}
          {% set denom_kwh = verbrauch_w * 24 / 1000 %}
          {% set median_t = states('sensor.opti_forecast_tomorrow_kwh')|float(0) %}
          {% set p10_raw_t = state_attr('sensor.opti_forecast_tomorrow_kwh','estimate10')|float(median_t) %}
          {% set p10_t = p10_raw_t if p10_raw_t > 0 else median_t %}
          {# Forecast-Optimismus (Feature #30) jetzt auch fuer den Morgen-Score:
             gleicher alpha-Blend wie opti_forecast_effective_remaining_kwh, damit
             EIN Regler konsistent Tag- UND Nacht-Pfad steuert. alpha=0 ->
             min(median, P10), bit-identisch zum alten Verhalten. Wichtig, weil der
             Peak-Reserve-Horizont abends an score_tomorrow haengt - sonst hielt die
             Reserve nachts bei pessimistischem Solcast-P10 unnoetig Ladung (-> Netzbezug). #}
          {% set alpha = ([0, [100, states('input_number.opti_forecast_optimismus')|float(0)]|min]|max) / 100 %}
          {% set blended_t = alpha * median_t + (1 - alpha) * p10_t %}
          {% set tomorrow = [median_t, blended_t]|min %}
          {{ (([ [tomorrow / denom_kwh, 1]|min, 0]|max) * 10)|round(0)|int }}
        attributes:
          alpha: "{{ ([0, [100, states('input_number.opti_forecast_optimismus')|float(0)]|min]|max) / 100 }}"
          median_kwh: "{{ states('sensor.opti_forecast_tomorrow_kwh')|float(0)|round(2) }}"
          p10_kwh: >
            {% set m = states('sensor.opti_forecast_tomorrow_kwh')|float(0) %}
            {% set p = state_attr('sensor.opti_forecast_tomorrow_kwh','estimate10')|float(m) %}
            {{ (p if p > 0 else m)|round(2) }}

      # -----------------------------------------------------------------------
      # 2a. Effektive Rest-Prognose (kWh) — einstellbarer Forecast-Optimismus
      #    (Feature #30). Zentraler Blend-Sensor zwischen Median und P10 der
      #    Rest-Tag-Prognose, gesteuert ueber input_number.opti_forecast_optimismus
      #    (alpha in % 0..100, aus sma_helpers.yaml). alpha=0 (Default, kein
      #    initial gesetzt) ist bit-identisch zum bisherigen min(median, P10)
      #    - alle Konsumenten (opti_target_soc, opti_forecast_score) lasen
      #    diese Kombination bislang lokal dupliziert; sie lesen jetzt nur noch
      #    diesen Sensor. alpha=50 -> (median+P10)/2, alpha=100 -> reiner
      #    Median (optimistisch: Ziel-SoC-Treppe steigt spaeter, Akku wird
      #    weniger frueh voll gefahren - mehr Puffer fuer Nachmittags-PV).
      #    Aeussere min(median, blended): nie optimistischer als der Median
      #    selbst - greift nur, wenn P10 > Median waere (Solcast-Ausreisser).
      # -----------------------------------------------------------------------
      - unique_id: opti_forecast_effective_remaining_kwh
        name: "Opti Forecast Effective Remaining kWh"
        unit_of_measurement: kWh
        state_class: measurement
        availability: >
          {{ has_value('sensor.opti_forecast_remaining_today_kwh') }}
        state: >
          {% set median = states('sensor.opti_forecast_remaining_today_kwh') | float(0) %}
          {% set p10_raw = state_attr('sensor.opti_forecast_remaining_today_kwh', 'estimate10') | float(median) %}
          {% set p10 = p10_raw if p10_raw > 0 else median %}
          {% set alpha = ([0, [100, states('input_number.opti_forecast_optimismus') | float(0)] | min] | max) / 100 %}
          {% set blended = alpha * median + (1 - alpha) * p10 %}
          {# Roh, NICHT gerundet: haelt alpha=0 bit-identisch zum alten
             min(median, P10) und vermeidet einen Rundungs-Kipp an den
             Ziel-SoC-Stufengrenzen. Anzeige-Rundung nur in den Attributen. #}
          {{ [median, blended] | min }}
        attributes:
          median_kwh: "{{ states('sensor.opti_forecast_remaining_today_kwh') | float(0) | round(3) }}"
          p10_kwh: >
            {% set median = states('sensor.opti_forecast_remaining_today_kwh') | float(0) %}
            {% set p10_raw = state_attr('sensor.opti_forecast_remaining_today_kwh', 'estimate10') | float(median) %}
            {{ (p10_raw if p10_raw > 0 else median) | round(3) }}
          alpha: "{{ ([0, [100, states('input_number.opti_forecast_optimismus') | float(0)] | min] | max) / 100 }}"

      # -----------------------------------------------------------------------
      # 3. Ziel-SoC (%) — abgeleitet aus akku_target_soc_intelligent (SMA-Templates
      #    Z.206-305): Quell-Entitäten auf opti_*-Layer getauscht. Stufen-Kennlinie 1:1,
      #    aber Flatter-Fix: 0.25-Quantisierung → echte Schmitt-Hysterese (siehe state).
      #    Kapazität: opti_battery_capacity_kwh ist BEREITS kWh (Quelle war Wh/1000).
      # -----------------------------------------------------------------------
      - unique_id: opti_target_soc
        name: "Opti Target SoC"
        unit_of_measurement: "%"
        state_class: measurement
        # Ziel-SoC mit echter Schmitt-Hysterese auf den Ratio-Stufen: Attribut 'level'
        # haelt die vorige Stufe, bis ratio die Grenze um die Marge m ueber-/unterschreitet.
        availability: >
          {{ has_value('sensor.opti_battery_capacity_kwh') and
             has_value('sensor.opti_forecast_remaining_today_kwh') and
             has_value('sensor.opti_forecast_effective_remaining_kwh') }}
        state: >
          {% set cap_kwh        = states('sensor.opti_battery_capacity_kwh') | float(12.8) %}
          {% set restproduktion = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
          {# Verbrauch geglaettet (60-min-Mittelwert, Legacy-Muster): sonst kippt eine
             kurze Lastspitze das Ziel-SoC-Band und erzeugt Flattern. #}
          {% set hausverbrauch  = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(1500)) %}
          {% set max_soc        = states('input_number.maxsoc') | float(95) %}
          {% set min_soc        = states('input_number.minsoc') | float(10) %}
          {% set netzladen      = states('input_boolean.hausakku_aus_netz_laden') %}

          {% if netzladen == 'on' %}
            {{ max_soc | round(0) }}
          {% else %}
            {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
            {% if sunset_time %}
              {% set remaining_hours = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
              {% set remaining_hours = [0.5, [12, remaining_hours] | min] | max %}
            {% else %}
              {% set remaining_hours = 6 %}
            {% endif %}

            {% set net_available = [0, restproduktion - (hausverbrauch / 1000 * remaining_hours)] | max %}
            {# Guard: cap_kwh <= 0 -> ratio 0 statt Division durch 0 (level 0 = maxsoc,
               konservativ wie der Peak-Rechenkern bei fehlender Kapazitaet). #}
            {% set ratio = 0 if cap_kwh <= 0 else net_available / cap_kwh %}
            {# Schmitt-Hysterese: vorige Stufe (Attribut 'level') halten, bis ratio die
               naechste Grenze um die Marge m ueber-/unterschreitet. Ersetzt die alte
               0.25-Quantisierung (= nur Kink-Verschiebung, kein Halteband).
               bounds = die alten effektiven 0.25-Rundungsgrenzen (akkuschonende Kennlinie
               1:1 wiederhergestellt), jetzt als Hysterese-Zentren mit Marge m. #}
            {% set m = 0.10 %}
            {% set bounds  = [0.375, 0.875, 1.375, 1.875, 2.875] %}
            {% set targets = [max_soc, 90, 80, 70, 60, 50] %}
            {% set plain = bounds | select('le', ratio) | list | count %}
            {% set prev = this.attributes.get('level', plain) | int(plain) %}
            {% set ns = namespace(l = prev) %}
            {% for _ in bounds %}
              {% if ns.l < 5 and ratio >= bounds[ns.l] + m %}{% set ns.l = ns.l + 1 %}{% endif %}
            {% endfor %}
            {% for _ in bounds %}
              {% if ns.l > 0 and ratio < bounds[ns.l - 1] - m %}{% set ns.l = ns.l - 1 %}{% endif %}
            {% endfor %}
            {% set target = targets[ns.l] %}

            {{ [min_soc, [max_soc, target] | min] | max | round(0) }}
          {% endif %}
        attributes:
          branch: >
            {% set cap_kwh        = states('sensor.opti_battery_capacity_kwh') | float(12.8) %}
            {% set restproduktion = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set hausverbrauch  = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(1500)) %}
            {% set max_soc        = states('input_number.maxsoc') | float(95) %}
            {% set netzladen      = states('input_boolean.hausakku_aus_netz_laden') %}
            {% if netzladen == 'on' %}
              netzladen → maxsoc
            {% else %}
              {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
              {% if sunset_time %}
                {% set remaining_hours = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
                {% set remaining_hours = [0.5, [12, remaining_hours] | min] | max %}
              {% else %}
                {% set remaining_hours = 6 %}
              {% endif %}
              {% set net_available = [0, restproduktion - (hausverbrauch / 1000 * remaining_hours)] | max %}
              {% set ratio = 0 if cap_kwh <= 0 else net_available / cap_kwh %}
              {% set m = 0.10 %}
              {% set bounds  = [0.375, 0.875, 1.375, 1.875, 2.875] %}
              {% set targets = [max_soc, 90, 80, 70, 60, 50] %}
              {% set plain = bounds | select('le', ratio) | list | count %}
              {% set prev = this.attributes.get('level', plain) | int(plain) %}
              {% set ns = namespace(l = prev) %}
              {% for _ in bounds %}
                {% if ns.l < 5 and ratio >= bounds[ns.l] + m %}{% set ns.l = ns.l + 1 %}{% endif %}
              {% endfor %}
              {% for _ in bounds %}
                {% if ns.l > 0 and ratio < bounds[ns.l - 1] - m %}{% set ns.l = ns.l - 1 %}{% endif %}
              {% endfor %}
              ratio={{ ratio | round(2) }} plain={{ plain }} → level {{ ns.l }} → {{ targets[ns.l] | round(0) }}%{{ ' (gehalten)' if ns.l != plain else '' }}
            {% endif %}
          # Hysterese-Speicher: aktuelle Stufe (0=maxsoc … 5=50%). Wird via this.attributes
          # zurueckgelesen; state + branch berechnen dieselbe Schmitt-Logik unabhaengig.
          level: >
            {% set cap_kwh        = states('sensor.opti_battery_capacity_kwh') | float(12.8) %}
            {% set restproduktion = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set hausverbrauch  = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(1500)) %}
            {% set max_soc        = states('input_number.maxsoc') | float(95) %}
            {% set netzladen      = states('input_boolean.hausakku_aus_netz_laden') %}
            {% if netzladen == 'on' %}
              0
            {% else %}
              {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
              {% if sunset_time %}
                {% set remaining_hours = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
                {% set remaining_hours = [0.5, [12, remaining_hours] | min] | max %}
              {% else %}
                {% set remaining_hours = 6 %}
              {% endif %}
              {% set net_available = [0, restproduktion - (hausverbrauch / 1000 * remaining_hours)] | max %}
              {% set ratio = 0 if cap_kwh <= 0 else net_available / cap_kwh %}
              {% set m = 0.10 %}
              {% set bounds = [0.375, 0.875, 1.375, 1.875, 2.875] %}
              {% set plain = bounds | select('le', ratio) | list | count %}
              {% set prev = this.attributes.get('level', plain) | int(plain) %}
              {% set ns = namespace(l = prev) %}
              {% for _ in bounds %}
                {% if ns.l < 5 and ratio >= bounds[ns.l] + m %}{% set ns.l = ns.l + 1 %}{% endif %}
              {% endfor %}
              {% for _ in bounds %}
                {% if ns.l > 0 and ratio < bounds[ns.l - 1] - m %}{% set ns.l = ns.l - 1 %}{% endif %}
              {% endfor %}
              {{ ns.l }}
            {% endif %}
          ratio: >
            {% set cap_kwh        = states('sensor.opti_battery_capacity_kwh') | float(12.8) %}
            {% set restproduktion = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set hausverbrauch  = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(1500)) %}
            {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
            {% if sunset_time %}
              {% set remaining_hours = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
              {% set remaining_hours = [0.5, [12, remaining_hours] | min] | max %}
            {% else %}
              {% set remaining_hours = 6 %}
            {% endif %}
            {% set net_available = [0, restproduktion - (hausverbrauch / 1000 * remaining_hours)] | max %}
            {{ (0 if cap_kwh <= 0 else net_available / cap_kwh) | round(3) }}
          net_available_kwh: >
            {% set restproduktion = states('sensor.opti_forecast_effective_remaining_kwh') | float(0) %}
            {% set hausverbrauch  = states('sensor.opti_house_consumption_60min_w') | float(states('sensor.opti_house_consumption_w') | float(1500)) %}
            {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
            {% if sunset_time %}
              {% set remaining_hours = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
              {% set remaining_hours = [0.5, [12, remaining_hours] | min] | max %}
            {% else %}
              {% set remaining_hours = 6 %}
            {% endif %}
            {{ [0, restproduktion - (hausverbrauch / 1000 * remaining_hours)] | max | round(2) }}
          remaining_hours: >
            {% set sunset_time = state_attr('sun.sun', 'next_setting') %}
            {% if sunset_time %}
              {% set h = (sunset_time | as_datetime - now()).total_seconds() / 3600 %}
              {{ ([0.5, [12, h] | min] | max) | round(1) }}
            {% else %}
              6.0
            {% endif %}

      # -----------------------------------------------------------------------
      # 4. Dynamische Ladestärke (W) — übersetzt aus
      #    akku_dynamische_ladestaerke_akku (SMA-Templates Z.82-136).
      #    SoC-Taper, Temp-Schutz und Deckel UNVERÄNDERT übernommen.
      #    BEWUSSTE ÄNDERUNG: Forecast-Label-Verzweigung der Quelle → opti_forecast_score-Bänder
      #      score <=1 → aggressiv (vormals Kritisch/Mangelhaft)
      #      score 2-4 → moderat   (vormals Ausreichend)
      #      score >=5 → schonend  (vormals Gut/Optimal/Hervorragend)
      #    Kapazität: opti_battery_capacity_kwh ist kWh → *1000 für Watt-Ausgabe
      #      (Quelle nutzte Wh direkt: C-Rate * Wh = W).
      # -----------------------------------------------------------------------
      - unique_id: opti_charge_power_w
        name: "Opti Charge Power W"
        unit_of_measurement: W
        state_class: measurement
        availability: >
          {{ has_value('sensor.opti_soc') and
             has_value('sensor.opti_battery_temp') and
             has_value('sensor.opti_battery_capacity_kwh') }}
        state: >
          {% set soc       = states('sensor.opti_soc') | float(50) %}
          {% set temp      = states('sensor.opti_battery_temp') | float(25) %}
          {% set cap       = states('sensor.opti_battery_capacity_kwh') | float(12.8) * 1000 %}
          {% set max_helper = states('input_number.akkusteuerung_max_ladestaerke') | float(3000) %}
          {% set score     = states('sensor.opti_forecast_score') | int(10) %} {# fehlender Forecast → konservativ/schonend (Score≥5 = GENTLE) #}

          {% if temp >= 50 or temp <= -5 %}
            0
          {% else %}
            {# Temperaturdrosselung bei Extremen #}
            {% if   temp >= 45 %} {% set temp_faktor = 0.5 %}
            {% elif temp <=  0 %} {% set temp_faktor = 0.25 %}
            {% else %}            {% set temp_faktor = 1.0 %}
            {% endif %}

            {# SOC-Stufen: prognoseabhängig verschoben (Score-Bänder) #}
            {% if score <= 1 %}
              {# Schlechter Tag: aggressiv laden, Grenzen hoch #}
              {% if   soc < 40 %} {% set c = cap * 0.40 %}
              {% elif soc < 70 %} {% set c = cap * 0.30 %}
              {% elif soc < 90 %} {% set c = cap * 0.20 %}
              {% elif soc < 97 %} {% set c = cap * 0.10 %}
              {% else %}          {% set c = cap * 0.05 %}
              {% endif %}
            {% elif score <= 4 %}
              {# Mittelmäßiger Tag: moderat #}
              {% if   soc < 35 %} {% set c = cap * 0.35 %}
              {% elif soc < 65 %} {% set c = cap * 0.25 %}
              {% elif soc < 87 %} {% set c = cap * 0.15 %}
              {% elif soc < 97 %} {% set c = cap * 0.08 %}
              {% else %}          {% set c = cap * 0.05 %}
              {% endif %}
            {% else %}
              {# Guter Tag: schonend, viel Zeit #}
              {% if   soc < 30 %} {% set c = cap * 0.30 %}
              {% elif soc < 60 %} {% set c = cap * 0.20 %}
              {% elif soc < 85 %} {% set c = cap * 0.15 %}
              {% elif soc < 97 %} {% set c = cap * 0.08 %}
              {% else %}          {% set c = cap * 0.05 %}
              {% endif %}
            {% endif %}

            {{ ([c * temp_faktor, max_helper] | min) | round(0) }}
          {% endif %}

      # -----------------------------------------------------------------------
      # 5. Preisniveau (Enum) — übersetzt aus strompreis_niveau
      #    (SMA-Templates Z.362-423). Perzentil-Bänder unverändert, aber Midrank-Zählung (Gleichstände halb) statt select('le') - Fix für flache Preistage.
      #    current → opti_price_current_ct_kwh; Reihe → opti_price_series today/tomorrow
      #    (bereits ct/kWh-Listen). <4 Werte → NORMAL.
      # -----------------------------------------------------------------------
      - unique_id: opti_price_level
        name: "Opti Price Level"
        icon: mdi:cash-clock
        availability: >
          {{ has_value('sensor.opti_price_current_ct_kwh') }}
        state: >
          {% set current = states('sensor.opti_price_current_ct_kwh') | float(0) %}
          {% set ns = namespace(prices=[]) %}
          {% for key in ['today', 'tomorrow'] %}
            {% set arr = state_attr('sensor.opti_price_series', key) %}
            {% if arr is iterable and arr is not string %}
              {% for it in arr %}
                {% if it is mapping %}
                  {% set p = it.get('total', it.get('price', it.get('value'))) %}
                {% else %}
                  {% set p = it %}
                {% endif %}
                {% set p = p | float(none) %}
                {% if p is not none %}
                  {% set ns.prices = ns.prices + [p] %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% set prices = ns.prices %}
          {% if prices | length >= 4 %}
            {# Midrank-Perzentil: Gleichstaende zaehlen halb. Fix fuer den Tie-Bug
               (select('le') machte bei flachen Preisen alles zu VERY_EXPENSIVE). #}
            {% set kleiner = prices | select('lt', current) | list | length %}
            {% set gleich  = prices | select('eq', current) | list | length %}
            {% set pct = (kleiner + 0.5 * gleich) / (prices | length) %}
            {% if   pct < 0.20 %}{% set level = 'VERY_CHEAP' %}
            {% elif pct < 0.40 %}{% set level = 'CHEAP' %}
            {% elif pct < 0.60 %}{% set level = 'NORMAL' %}
            {% elif pct < 0.80 %}{% set level = 'EXPENSIVE' %}
            {% else %}{% set level = 'VERY_EXPENSIVE' %}
            {% endif %}
            {{ level }}
          {% else %}
            NORMAL
          {% endif %}
        attributes:
          perzentil: >
            {% set current = states('sensor.opti_price_current_ct_kwh') | float(0) %}
            {% set ns = namespace(prices=[]) %}
            {% for key in ['today', 'tomorrow'] %}
              {% set arr = state_attr('sensor.opti_price_series', key) %}
              {% if arr is iterable and arr is not string %}
                {% for it in arr %}
                  {% if it is mapping %}{% set p = it.get('total', it.get('price', it.get('value'))) %}{% else %}{% set p = it %}{% endif %}
                  {% set p = p | float(none) %}
                  {% if p is not none %}{% set ns.prices = ns.prices + [p] %}{% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% set prices = ns.prices %}
            {% if prices | length >= 4 %}{{ (((prices | select('lt', current) | list | length) + 0.5 * (prices | select('eq', current) | list | length)) / (prices | length) * 100) | round(1) }}{% else %}none{% endif %}
          aktueller_preis: "{{ states('sensor.opti_price_current_ct_kwh') | float(0) }}"
          anzahl_preise: >
            {% set ns = namespace(c=0) %}
            {% for key in ['today', 'tomorrow'] %}
              {% set arr = state_attr('sensor.opti_price_series', key) %}
              {% if arr is iterable and arr is not string %}{% set ns.c = ns.c + (arr | list | length) %}{% endif %}
            {% endfor %}
            {{ ns.c }}

      # -----------------------------------------------------------------------
      # 6. Mindestentladepreis (ct/kWh) — BEWUSST KEIN float(0):
      #    fehlende Helfer dürfen nicht zu 0 ct werden (Fail-safe).
      #    ladepreis UND mindestpreisdifferenz sind in EUR/kWh (Live-Konvention,
      #    z.B. 0.306 / 0.08) → beide ×100 nach ct. (Live-validiert: 38.6 ct.)
      # -----------------------------------------------------------------------
      - unique_id: opti_mindestentladepreis_ct_kwh
        name: "Opti Mindestentladepreis ct kWh"
        unit_of_measurement: ct/kWh
        availability: "{{ has_value('input_number.ladepreis') and has_value('input_number.mindestpreisdifferenz_lade_entladepreis') }}"
        state: "{{ ((states('input_number.ladepreis')|float(0) + states('input_number.mindestpreisdifferenz_lade_entladepreis')|float(0)) * 100)|round(2) }}"
        attributes: { ladepreis_ct: "{{ (states('input_number.ladepreis')|float(0) * 100)|round(2) }}", differenz_ct: "{{ (states('input_number.mindestpreisdifferenz_lade_entladepreis')|float(0) * 100)|round(2) }}" }

      # -----------------------------------------------------------------------
      # 7. Akku-Restlaufzeit (h) — übersetzt aus house_battery_runtime_raw
      #    (SMA-Templates Z.25-80). Logik/Schwellen unverändert, nur Quellen:
      #      Kapazität (Wh/1000) → opti_battery_capacity_kwh (bereits kWh, kein /1000)
      #      SoC → opti_soc; PV-Gate → opti_pv_power_w; Entladelast → opti_house_consumption_w
      #      MinSOC/MaxSOC → input_number.minsoc / input_number.maxsoc
      # -----------------------------------------------------------------------
      - unique_id: opti_runtime_h
        name: "Opti Runtime H"
        unit_of_measurement: "hours"
        state_class: measurement
        availability: >
          {{ has_value('sensor.opti_soc') and
             has_value('sensor.opti_battery_capacity_kwh') and
             has_value('sensor.opti_house_consumption_w') }}
        state: >
          {% set soc = states('sensor.opti_soc') %}
          {% set capacity_kwh_raw = states('sensor.opti_battery_capacity_kwh') %}
          {% set house_w = states('sensor.opti_house_consumption_w') %}
          {% set pv_power = states('sensor.opti_pv_power_w') %}
          {% set min_soc_helper = states('input_number.minsoc') %}
          {% set max_soc_helper = states('input_number.maxsoc') %}

          {% if soc not in ['unavailable', 'unknown', None] and
                capacity_kwh_raw not in ['unavailable', 'unknown', None] and
                house_w not in ['unavailable', 'unknown', None] and
                pv_power not in ['unavailable', 'unknown', None] %}

            {% set soc_value = soc|float(0) %}
            {% set capacity_kwh = capacity_kwh_raw|float(0) %}
            {% set pv_power_value = pv_power|float(0) %}

            {% set min_soc = min_soc_helper|float(10) if min_soc_helper not in ['unavailable', 'unknown', None] else 10 %}
            {% set max_soc = max_soc_helper|float(95) if max_soc_helper not in ['unavailable', 'unknown', None] else 95 %}
            {% set min_soc_safe = max(0, min(100, min_soc)) %}
            {% set max_soc_safe = max(min_soc_safe, min(100, max_soc)) %}

            {% if pv_power_value < 100 %}
              {% set discharge_power_kw = house_w|float(0) / 1000 %}

              {% set current_soc_in_range = max(min_soc_safe, min(max_soc_safe, soc_value)) %}
              {% set available_soc_percentage = (current_soc_in_range - min_soc_safe) / (max_soc_safe - min_soc_safe) * 100 if max_soc_safe > min_soc_safe else 0 %}
              {% set available_energy_kwh = (available_soc_percentage / 100) * capacity_kwh %}

              {% if discharge_power_kw > 0 and available_energy_kwh > 0 %}
                {% set runtime_hours = available_energy_kwh / discharge_power_kw %}
                {{ [runtime_hours, 24]|min|round(2) }}
              {% elif discharge_power_kw == 0 %}
                999
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}
          {% else %}
            unavailable
          {% endif %}

      # -----------------------------------------------------------------------
      # 7a. Balancing-/Deep-Charge-Watchdog (Feature #31) — READ-ONLY-Signal.
      #    Feuert, wenn der Akku zu lange nicht ~voll war (counter
      #    tage_seit_akku100 >= Intervall), damit das BMS des BYD HVS balancen/
      #    kalibrieren kann. Ladeziel bewusst bis 100% (nicht nur bis maxsoc),
      #    damit die Zelle in die CV-Phase kommt - deshalb greift der Watchdog
      #    besonders im Sommer-Schonband (maxsoc<100), wo die Ziel-SoC-Treppe
      #    100% nie erreicht. Rein abgeleitet -> restart-durabel (kein Latch).
      #    State: 'aus' | 'pv' | 'netz'. Staffelung (Kosten aufsteigend):
      #      1. tagsueber          -> 'pv'   (ganztags PV-bevorzugt, bewusst
      #                                       simpel, kein PV>Haus-Gate im MVP)
      #      2. Gratis-/Negativpreis (cur < EEG) -> 'netz'   (sofort, keine Karenz)
      #      3. bezahlter Fallback -> 'netz'  (erst nach Karenz, nur VERY_CHEAP/
      #                                       CHEAP UND cur <= absoluter Deckel,
      #                                       Deckel 0 = aus = fail-safe)
      #      sonst -> 'aus' (auf besseres Fenster warten).
      #    Fail-safe: fehlt opti_soc (float(-1)) -> faellig false -> 'aus'.
      #    Intervall 0 = Watchdog global aus.
      # -----------------------------------------------------------------------
      - unique_id: opti_balancing_watchdog
        name: "Opti Balancing Watchdog"
        icon: mdi:battery-heart-variant
        state: >
          {% set soc = states('sensor.opti_soc')|float(-1) %}
          {% set counter = states('counter.tage_seit_akku100')|int(0) %}
          {% set intervall = states('input_number.opti_balancing_intervall_tage')|int(0) %}
          {% set karenz = states('input_number.opti_balancing_karenz_tage')|int(0) %}
          {% set maxct = states('input_number.opti_balancing_max_ct')|float(0) %}
          {% set cur = states('sensor.opti_price_current_ct_kwh')|float(0) %}
          {% set hv_cur = has_value('sensor.opti_price_current_ct_kwh') %}
          {% set eeg = states('input_number.opti_einspeiseverguetung_ct')|float(0) %}
          {% set price = states('sensor.opti_price_level') %}
          {% set day = is_state('sun.sun','above_horizon') %}
          {% set bal_netz = states('input_boolean.opti_balancing_netzladen') == 'on' %}
          {% set spreiz = states('sensor.byd_zellspreizung_ruhe')|float(-1) %}
          {% set schwelle = states('input_number.opti_balancing_spreizungs_schwelle')|float(0) %}
          {% set cooldown = states('input_number.opti_balancing_bedarf_cooldown_tage')|int(0) %}
          {# Bedarf: Ruhe-Zellspreizung ueber Schwelle UND Mindestabstand (cooldown)
             seit letztem Vollzyklus -> zieht das Balancing vor. schwelle=0 = aus. #}
          {% set bedarf = schwelle > 0 and spreiz >= 0 and spreiz >= schwelle and counter >= cooldown %}
          {# soc<100 bewusst NICHT mehr in faellig: der Watchdog haelt bis zum
             counter-Reset (30min stabil >done_soc) oben - sonst kappt der maxsoc-
             Ladedeckel bei 100% zu frueh und der Balancing-Zyklus wird nie fertig. #}
          {% set faellig = intervall > 0 and soc >= 0 and (counter >= intervall or bedarf) %}
          {# 'netz' hat einen EIGENEN Schalter opti_balancing_netzladen (Default aus),
             entkoppelt vom allgemeinen opti_prognose_netzladen. So bleibt die harte
             Netzlade-Garantie (docs/canonical-layer.md #26) erhalten: Balancing zieht
             nur Netzstrom, wenn dieser Wartungs-Schalter bewusst an ist. 'pv' bleibt
             ungegatet - PV-Vollladung zieht keinen Netzstrom. #}
          {% if not faellig %}aus
          {%- elif day %}pv
          {%- elif bal_netz and hv_cur and cur < eeg %}netz
          {%- elif bal_netz and counter >= intervall + karenz and hv_cur and price in ['VERY_CHEAP','CHEAP'] and maxct > 0 and cur <= maxct %}netz
          {%- else %}aus{% endif %}
        attributes:
          grund: >
            {% set soc = states('sensor.opti_soc')|float(-1) %}
            {% set counter = states('counter.tage_seit_akku100')|int(0) %}
            {% set intervall = states('input_number.opti_balancing_intervall_tage')|int(0) %}
            {% set karenz = states('input_number.opti_balancing_karenz_tage')|int(0) %}
            {% set maxct = states('input_number.opti_balancing_max_ct')|float(0) %}
            {% set cur = states('sensor.opti_price_current_ct_kwh')|float(0) %}
            {% set hv_cur = has_value('sensor.opti_price_current_ct_kwh') %}
            {% set eeg = states('input_number.opti_einspeiseverguetung_ct')|float(0) %}
            {% set price = states('sensor.opti_price_level') %}
            {% set day = is_state('sun.sun','above_horizon') %}
            {% set bal_netz = states('input_boolean.opti_balancing_netzladen') == 'on' %}
            {% set spreiz = states('sensor.byd_zellspreizung_ruhe')|float(-1) %}
            {% set schwelle = states('input_number.opti_balancing_spreizungs_schwelle')|float(0) %}
            {% set cooldown = states('input_number.opti_balancing_bedarf_cooldown_tage')|int(0) %}
            {% set bedarf = schwelle > 0 and spreiz >= 0 and spreiz >= schwelle and counter >= cooldown %}
            {% set faellig = intervall > 0 and soc >= 0 and (counter >= intervall or bedarf) %}
            {% if intervall <= 0 %}Watchdog aus (Intervall 0)
            {%- elif soc < 0 %}opti_soc fehlt
            {%- elif not faellig %}nicht faellig ({{counter}}/{{intervall}} Tage, Spreizung {{spreiz}}/{{schwelle}}mV)
            {%- elif day %}PV-Vollladung ({{ 'Zeit' if counter>=intervall else 'Spreizung '~spreiz~'mV' }}, {{counter}} Tage seit voll)
            {%- elif bal_netz and hv_cur and cur < eeg %}Gratis-Netz ({{cur}}ct < EEG {{eeg}}ct)
            {%- elif bal_netz and counter >= intervall + karenz and hv_cur and price in ['VERY_CHEAP','CHEAP'] and maxct > 0 and cur <= maxct %}Bezahltes Netz ({{cur}}ct <= Deckel {{maxct}}ct, nach Karenz)
            {%- elif not bal_netz and (hv_cur and cur < eeg or counter >= intervall + karenz and hv_cur and price in ['VERY_CHEAP','CHEAP'] and maxct > 0 and cur <= maxct) %}Netz-Balancing gesperrt (opti_balancing_netzladen aus)
            {%- else %}warte auf besseres Fenster{% endif %}
          soc: "{{ states('sensor.opti_soc') }}"
          tage_seit_voll: "{{ states('counter.tage_seit_akku100') }}"
          intervall_tage: "{{ states('input_number.opti_balancing_intervall_tage') }}"
          faellig_grund: >
            {% set counter = states('counter.tage_seit_akku100')|int(0) %}
            {% set intervall = states('input_number.opti_balancing_intervall_tage')|int(0) %}
            {% set spreiz = states('sensor.byd_zellspreizung_ruhe')|float(-1) %}
            {% set schwelle = states('input_number.opti_balancing_spreizungs_schwelle')|float(0) %}
            {% set cooldown = states('input_number.opti_balancing_bedarf_cooldown_tage')|int(0) %}
            {% set bedarf = schwelle > 0 and spreiz >= 0 and spreiz >= schwelle and counter >= cooldown %}
            {% set faellig = intervall > 0 and (counter >= intervall or bedarf) %}
            {% if not faellig %}keiner{% elif counter >= intervall %}zeit{% else %}spreizung{% endif %}
          ruhe_spreizung_mv: "{{ states('sensor.byd_zellspreizung_ruhe') }}"
          schwelle_mv: "{{ states('input_number.opti_balancing_spreizungs_schwelle') }}"

      # -----------------------------------------------------------------------
      # 8. Strategie-Vorschau (Soll-Modus, READ-ONLY) — spiegelt die Entscheidungs-
      #    kette aus automations/opti_strategie.yaml, OHNE zu steuern. Vergleich
      #    Soll (state) vs Ist (input_select.akkusteuerung_modus, Attribut ist_modus).
      #    Toggles opti_prognose_netzladen / opti_pv_ueberschuss_ladung existieren live
      #    und werden hier wie in der echten Strategie gelesen (siehe unten). Bei
      #    Änderung der Strategie-Zweige MUSS dieser Sensor mitgespiegelt werden.
      #    Peak-Allokations-Zweige (Negativpreis/Vorladen/Leiter) sind mitgespiegelt.
      # -----------------------------------------------------------------------
      - unique_id: opti_strategie_vorschau
        name: "Opti Strategie Vorschau"
        icon: mdi:eye-check
        availability: "{{ has_value('sensor.opti_soc') and has_value('sensor.opti_battery_capacity_kwh') }}"
        state: >
          {% set soc = states('sensor.opti_soc')|float(-1) %}
          {% set s = states('sensor.opti_forecast_score')|float(-1) %}
          {% set st = states('sensor.opti_forecast_score_tomorrow')|float(-1) %}
          {% set price = states('sensor.opti_price_level') %}
          {% set target = states('sensor.opti_target_soc')|float(100) %}
          {% set minsoc = states('input_number.minsoc')|float(10) %}
          {% set day = is_state('sun.sun','above_horizon') %}
          {% set prog = states('input_boolean.opti_prognose_netzladen') == 'on' %}
          {% set ueb = states('input_boolean.opti_pv_ueberschuss_ladung') == 'on' %}
          {% set win = states('binary_sensor.opti_winter_charging_allowed') == 'on' %}
          {% set hv_s = has_value('sensor.opti_forecast_score') %}
          {% set hv_st = has_value('sensor.opti_forecast_score_tomorrow') %}
          {% set p_e = price in ['VERY_CHEAP','CHEAP','NORMAL','EXPENSIVE'] %}
          {% set p_n = price in ['VERY_CHEAP','CHEAP','NORMAL'] %}
          {% set p_c = price in ['VERY_CHEAP','CHEAP'] %}
          {% set H = 3 %}
          {% set cur = states('sensor.opti_price_current_ct_kwh')|float(0) %}
          {% set hv_cur = has_value('sensor.opti_price_current_ct_kwh') %}
          {% set eeg = states('input_number.opti_einspeiseverguetung_ct')|float(0) %}
          {% set spread = states('input_number.opti_netzlade_spread_ct')|float(10) %}
          {% set aktiv = is_state('binary_sensor.opti_peak_reserve_aktiv','on') %}
          {% set ges_res = states('sensor.opti_peak_reserve_soc')|float(101) %}
          {% set ve_res = state_attr('sensor.opti_peak_reserve_soc','reserve_ve_soc')|float(101) %}
          {% set minv_raw = state_attr('sensor.opti_peak_reserve_soc','min_preis_vor_peak_ct') %}
          {% set minv = minv_raw|float(none) if minv_raw is not none else none %}
          {% set avg = state_attr('sensor.opti_peak_reserve_soc','peak_preis_avg_ct')|float(none) %}
          {% set ve_avg = state_attr('sensor.opti_peak_reserve_soc','peak_preis_ve_avg_ct')|float(none) %}
          {% set halte_spread = states('input_number.opti_halte_spread_ct')|float(3) %}
          {% set band = 5 if states('input_select.akkusteuerung_modus') == 'Akku nur Laden' else 3 %}
          {% set stopband = 0 if states('input_select.akkusteuerung_modus') == 'Akku Netzladen' else 3 %}
          {% set fenster = (minv is none) or (cur <= minv + 0.5) %}
          {% set ev = states('input_boolean.opti_ev_akku_pause') == 'on'
                      and is_state('binary_sensor.opti_ev_schnellladung', 'on') %}
          {% if soc >= 0 and soc < minsoc %}Akku nur Laden
          {%- elif prog and hv_cur and hv_s and s < 3 and soc >= 0 and soc < states('input_number.maxsoc')|float(95) - stopband and cur < eeg and fenster %}Akku Netzladen
          {%- elif prog and aktiv and hv_cur and soc >= 0 and soc < ges_res - stopband and avg is not none and (avg - cur) >= spread and fenster %}Akku Netzladen
          {%- elif aktiv and soc >= 0 and price == 'VERY_EXPENSIVE' and not ev %}Akku nur Entladen
          {%- elif aktiv and soc >= 0 and price == 'EXPENSIVE' and soc > ve_res + band and not ev %}Akku nur Entladen
          {%- elif is_state('sensor.opti_balancing_watchdog','pv') %}Akku nur Laden
          {%- elif is_state('sensor.opti_balancing_watchdog','netz') %}Akku Netzladen
          {%- elif not aktiv and not ev and soc >= 0 and soc >= (states('input_number.maxsoc')|float(95) - (3 if states('input_select.akkusteuerung_modus') == 'Akku nur Entladen' else 0)) %}Akku nur Entladen
          {%- elif prog and win and hv_s and hv_st and soc < 20 and s < 3 and st < 3 and p_e %}Akku nur Laden
          {%- elif prog and hv_s and hv_st and soc < 75 and s < 3 and st < 3 and p_n %}Akku nur Laden
          {%- elif prog and win and hv_s and hv_st and soc < 80 and s < 3 and st < 3 and p_e %}Akku nur Laden
          {%- elif prog and hv_s and soc < 15 and s < 3 and p_e %}Akku nur Laden
          {%- elif prog and hv_s and soc < 45 and s < 3 and p_c %}Akku nur Laden
          {# EV-Schnelllade-Sperre: nach den Lade-Zweigen, vor allen Zweigen,
             die Dynamisch/Entladen liefern koennen (inkl. Akku voll). Sperr-
             Modus 'Akku nur Laden' = reine Entladesperre, PV-Laden bleibt. #}
          {%- elif ev %}Akku nur Laden
          {%- elif ueb and day and is_state('binary_sensor.opti_ueberschuss_70_aktiv','on') and soc < 100 %}Akku Dynamisch
          {%- elif ueb and day and is_state('binary_sensor.opti_ueberschuss_ac_aktiv','on') and soc < 100 %}Akku Dynamisch
          {%- elif soc > 99 %}Akku Dynamisch
          {%- elif aktiv and hv_cur and soc >= 0 and price == 'EXPENSIVE' and ve_avg is not none and (ve_avg - cur) >= halte_spread %}Akku nur Laden
          {%- elif aktiv and soc >= 0 and p_n and soc <= ges_res + band %}Akku nur Laden
          {%- elif soc > minsoc and soc < target - H and day %}Akku Dynamisch
          {# Asymmetrische Hysterese gegen Ziel-SoC-Flattern (v.a. mittags, wenn
             PV den SoC ueber die Schwelle drueckt): rein bei target+H, drin
             bleiben bis target. Ohne das flippt der Modus im Minutentakt
             Entladen<->Dynamisch, weil das Entladen selbst den SoC wieder
             unter die Kante zieht. #}
          {%- elif soc > target + (0 if is_state('input_select.akkusteuerung_modus','Akku nur Entladen') else H) %}Akku nur Entladen
          {%- elif soc >= 0 %}Akku Dynamisch
          {%- else %}unbekannt{% endif %}
        attributes:
          grund: >
            {% set soc = states('sensor.opti_soc')|float(-1) %}
            {% set s = states('sensor.opti_forecast_score')|float(-1) %}
            {% set st = states('sensor.opti_forecast_score_tomorrow')|float(-1) %}
            {% set price = states('sensor.opti_price_level') %}
            {% set target = states('sensor.opti_target_soc')|float(100) %}
            {% set minsoc = states('input_number.minsoc')|float(10) %}
            {% set day = is_state('sun.sun','above_horizon') %}
            {% set prog = states('input_boolean.opti_prognose_netzladen') == 'on' %}
            {% set ueb = states('input_boolean.opti_pv_ueberschuss_ladung') == 'on' %}
            {% set win = states('binary_sensor.opti_winter_charging_allowed') == 'on' %}
            {% set hv_s = has_value('sensor.opti_forecast_score') %}
            {% set hv_st = has_value('sensor.opti_forecast_score_tomorrow') %}
            {% set p_e = price in ['VERY_CHEAP','CHEAP','NORMAL','EXPENSIVE'] %}
            {% set p_n = price in ['VERY_CHEAP','CHEAP','NORMAL'] %}
            {% set p_c = price in ['VERY_CHEAP','CHEAP'] %}
            {% set H = 3 %}
            {% set cur = states('sensor.opti_price_current_ct_kwh')|float(0) %}
            {% set hv_cur = has_value('sensor.opti_price_current_ct_kwh') %}
            {% set eeg = states('input_number.opti_einspeiseverguetung_ct')|float(0) %}
            {% set spread = states('input_number.opti_netzlade_spread_ct')|float(10) %}
            {% set aktiv = is_state('binary_sensor.opti_peak_reserve_aktiv','on') %}
            {% set ges_res = states('sensor.opti_peak_reserve_soc')|float(101) %}
            {% set ve_res = state_attr('sensor.opti_peak_reserve_soc','reserve_ve_soc')|float(101) %}
            {% set minv_raw = state_attr('sensor.opti_peak_reserve_soc','min_preis_vor_peak_ct') %}
            {% set minv = minv_raw|float(none) if minv_raw is not none else none %}
            {% set avg = state_attr('sensor.opti_peak_reserve_soc','peak_preis_avg_ct')|float(none) %}
            {% set ve_avg = state_attr('sensor.opti_peak_reserve_soc','peak_preis_ve_avg_ct')|float(none) %}
            {% set halte_spread = states('input_number.opti_halte_spread_ct')|float(3) %}
            {% set band = 5 if states('input_select.akkusteuerung_modus') == 'Akku nur Laden' else 3 %}
            {% set stopband = 0 if states('input_select.akkusteuerung_modus') == 'Akku Netzladen' else 3 %}
            {% set fenster = (minv is none) or (cur <= minv + 0.5) %}
            {% set ev = states('input_boolean.opti_ev_akku_pause') == 'on'
                        and is_state('binary_sensor.opti_ev_schnellladung', 'on') %}
            {% if soc >= 0 and soc < minsoc %}MinSOC-Schutz (SoC<{{minsoc}})
            {%- elif prog and hv_cur and hv_s and s < 3 and soc >= 0 and soc < states('input_number.maxsoc')|float(95) - stopband and cur < eeg and fenster %}Negativpreis-Laden ({{cur}}ct < EEG {{eeg}}ct)
            {%- elif prog and aktiv and hv_cur and soc >= 0 and soc < ges_res - stopband and avg is not none and (avg - cur) >= spread and fenster %}Peak-Vorladen (Spread {{(avg - cur)|round(1)}}ct, bis {{ges_res}}%)
            {%- elif aktiv and soc >= 0 and price == 'VERY_EXPENSIVE' and not ev %}Peak-Leiter L1 (VE entladen)
            {%- elif aktiv and soc >= 0 and price == 'EXPENSIVE' and soc > ve_res + band and not ev %}Peak-Leiter L2 (EXP entladen, ueber VE-Reserve {{ve_res}}%)
            {%- elif is_state('sensor.opti_balancing_watchdog','pv') %}Balancing-Watchdog (PV-Vollladung)
            {%- elif is_state('sensor.opti_balancing_watchdog','netz') %}Balancing-Watchdog (Netz-Vollladung)
            {%- elif not aktiv and not ev and soc >= 0 and soc >= (states('input_number.maxsoc')|float(95) - (3 if states('input_select.akkusteuerung_modus') == 'Akku nur Entladen' else 0)) %}Ladedeckel (maxsoc erreicht)
            {%- elif prog and win and hv_s and hv_st and soc < 20 and s < 3 and st < 3 and p_e %}SOC<20 Prognose (heute+morgen schlecht)
            {%- elif prog and hv_s and hv_st and soc < 75 and s < 3 and st < 3 and p_n %}SOC<75 Prognose (Preis bis NORMAL)
            {%- elif prog and win and hv_s and hv_st and soc < 80 and s < 3 and st < 3 and p_e %}SOC<80 Wintermodus
            {%- elif prog and hv_s and soc < 15 and s < 3 and p_e %}SOC<15 Notfall
            {%- elif prog and hv_s and soc < 45 and s < 3 and p_c %}SOC<45 sehr guenstig
            {%- elif ev %}EV-Sperre (Schnellladung, Entladesperre)
            {%- elif ueb and day and is_state('binary_sensor.opti_ueberschuss_70_aktiv','on') and soc < 100 %}70% Ueberschuss (tag, entprellt)
            {%- elif ueb and day and is_state('binary_sensor.opti_ueberschuss_ac_aktiv','on') and soc < 100 %}AC Ueberschuss (tag, entprellt)
            {%- elif soc > 99 %}Akku voll
            {%- elif aktiv and hv_cur and soc >= 0 and price == 'EXPENSIVE' and ve_avg is not none and (ve_avg - cur) >= halte_spread %}Peak-Leiter L3 (halten fuer VE, Reserve {{ve_res}}%, Spread {{(ve_avg - cur)|round(1)}}ct)
            {%- elif aktiv and soc >= 0 and p_n and soc <= ges_res + band %}Peak-Leiter L4 (halten fuer Peaks, Reserve {{ges_res}}%)
            {%- elif soc > minsoc and soc < target - H and day %}dyn bis Ziel (tag)
            {%- elif soc > target + (0 if is_state('input_select.akkusteuerung_modus','Akku nur Entladen') else H) %}ueber Ziel-SoC
            {%- elif soc >= 0 %}Default (Nacht/keine Aktion)
            {%- else %}opti_soc fehlt{% endif %}
          ist_modus: "{{ states('input_select.akkusteuerung_modus') }}"
          soc: "{{ states('sensor.opti_soc') }}"
          ziel_soc: "{{ states('sensor.opti_target_soc') }}"
          score_heute: "{{ states('sensor.opti_forecast_score') }}"
          score_morgen: "{{ states('sensor.opti_forecast_score_tomorrow') }}"
          price_level: "{{ states('sensor.opti_price_level') }}"
          tag: "{{ is_state('sun.sun','above_horizon') }}"
          annahme: "Toggles opti_prognose_netzladen/opti_pv_ueberschuss_ladung existieren live, aktueller Zustand: prognose={{ states('input_boolean.opti_prognose_netzladen') }}, ueberschuss={{ states('input_boolean.opti_pv_ueberschuss_ladung') }}"

  # ---------------------------------------------------------------------------
  # 9. Entlade-Peak-Allokation: Reserve-SoC + Aktiv-Gate (trigger-basiert).
  #    Rechnet aus opti_price_series (today/tomorrow) die Reserve fuer kommende
  #    teure Stunden im Wiederauflade-Horizont. Trigger-basiert, damit der
  #    Rechenkern EINMAL in 'variables' steht (kein 7x dupliziertes Template);
  #    Bonus: RestoreEntity ueber HA-Neustarts. Braucht HA >= 2024.10.
  #    Klassifikation: Midrank-Perzentil, identische Grenzen wie opti_price_level.
  #    Fail-safe: < 4 Preise -> Sensor unavailable (BEWUSST anders als der
  #    NORMAL-Fallback von opti_price_level: Reserve 0 saehe aus wie "keine
  #    Peaks" und wuerde die Leiter falsch scharf schalten).
  #    Raster: today/tomorrow werden ueber die Listenlaenge erkannt (Stunden-
  #    ODER Viertelstundenraster, siehe Tibber-15-min-Umstellung 07/2026);
  #    slot_h wird PRO LISTE separat abgeleitet, da today/tomorrow in
  #    Uebergangsphasen unterschiedliche Raster haben koennen. Bekannte
  #    Grenze: Preislisten ohne Zeitstempel, Zuordnung per Index
  #    (DST-Tage koennen slot_h leicht ungenau machen - akzeptiert).
  #    Fensterstart bleibt die aktuelle volle STUNDE (nicht der aktuelle
  #    Slot): bei Viertelstundenraster zaehlen dadurch bis zu 3 bereits
  #    vergangene Slots der laufenden Stunde konservativ mit.
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id:
          - sensor.opti_price_series
          - sensor.opti_forecast_score
          - sensor.opti_forecast_score_tomorrow
          - sensor.opti_battery_capacity_kwh
          - input_number.opti_peak_verbrauch_kw
          - input_number.minsoc
          - input_number.maxsoc
          - input_number.opti_peak_min_aufschlag_ct
    variables:
      peak: >
        {% set cap_kwh = states('sensor.opti_battery_capacity_kwh') | float(0) %}
        {% set verbrauch_kw = states('input_number.opti_peak_verbrauch_kw') | float(0.8) %}
        {% set min_soc = states('input_number.minsoc') | float(10) %}
        {% set max_soc = states('input_number.maxsoc') | float(95) %}
        {% set aufschlag = states('input_number.opti_peak_min_aufschlag_ct') | float(10) %}
        {% set eta = 0.9 %}
        {# 1. Preisbasis + Zukunftszeitpunkte einsammeln (Slot-Index -> Zeitpunkt).
           slot_h wird PRO LISTE aus der Listenlaenge abgeleitet (24 / Laenge):
           Stundenraster -> slot_h=1.0, Viertelstundenraster -> slot_h=0.25.
           today/tomorrow koennen unterschiedliche Raster haben (z.B. waehrend
           der Tibber-Umstellung auf 15-min-Day-Ahead-Preise).
           Raster-Guard: nur Laengen 20-27 (Stundenraster inkl. DST) oder
           80-108 (Viertelstundenraster inkl. DST) sind gueltig; jede andere
           nicht-leere Laenge verwirft die GESAMTE Preisbasis (raster_ok=false).
           Eine leere Liste (today/tomorrow fehlt) ist erlaubt und traegt
           einfach nichts bei. Bei DST-Tagen ist slot_h leicht ungenau
           (24/92 bzw. 24/100) - akzeptiert. #}
        {% set ns = namespace(prices=[], future=[], raster_ok=true) %}
        {% set heute = today_at('00:00') %}
        {% for key in ['today', 'tomorrow'] %}
          {% set arr = state_attr('sensor.opti_price_series', key) %}
          {% if arr is iterable and arr is not string and arr | length > 0 %}
            {% set laenge = arr | length %}
            {% if not ((20 <= laenge <= 27) or (80 <= laenge <= 108)) %}
              {% set ns.raster_ok = false %}
            {% endif %}
            {% set slot_h = 24 / laenge %}
            {% set base = heute if key == 'today' else heute + timedelta(days=1) %}
            {% for it in arr %}
              {% if it is mapping %}{% set p = it.get('total', it.get('price', it.get('value'))) %}{% else %}{% set p = it %}{% endif %}
              {% set p = p | float(none) %}
              {% if p is not none %}
                {% set ns.prices = ns.prices + [p] %}
                {% set ns.future = ns.future + [[base + timedelta(hours=loop.index0 * slot_h), p, slot_h]] %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {% set n = ns.prices | length if ns.raster_ok else 0 %}
        {# 2. Wiederauflade-Horizont: bis naechster Sonnenaufgang + 3 h mit gutem
           Tages-Score (> 2), sonst 36 h. Tagsueber + guter Heute-Score -> leer. #}
        {% set s_heute = states('sensor.opti_forecast_score') | float(-1) %}
        {% set s_morgen = states('sensor.opti_forecast_score_tomorrow') | float(-1) %}
        {% set horizont_max = now() + timedelta(hours=36) %}
        {% if is_state('sun.sun', 'above_horizon') and s_heute > 2 %}
          {# Auf die volle Stunde gekappt (== Fensterstart), damit das Fenster
             wirklich leer ist - now() liesse die laufende Stunde durchrutschen,
             sobald Minute > 0. #}
          {% set horizont_ende = now().replace(minute=0, second=0, microsecond=0) %}
        {% else %}
          {% set rising = state_attr('sun.sun', 'next_rising') %}
          {% set rise = (rising | as_datetime | as_local) if rising else none %}
          {% if rise is not none %}
            {% set rise_score = s_heute if rise.date() == now().date() else s_morgen %}
            {% if rise_score > 2 %}
              {% set horizont_ende = [rise + timedelta(hours=3), horizont_max] | min %}
            {% else %}
              {% set horizont_ende = horizont_max %}
            {% endif %}
          {% else %}
            {% set horizont_ende = horizont_max %}
          {% endif %}
        {% endif %}
        {# 3a. Erster Durchlauf: Horizont-Tief (fenster_min) unter den
           Zukunftsstunden im Horizont bestimmen - Basis fuer die oekonomische
           Peak-Filterung (Hebel 1: nur Stunden, die den Aufschlag ueber dem
           Horizont-Tief bringen, zaehlen als Peak). #}
        {% set start = now().replace(minute=0, second=0, microsecond=0) %}
        {% set fw = namespace(min=none) %}
        {% if n >= 4 %}
          {% for eintrag in ns.future %}
            {% set t = eintrag[0] %}
            {% set p = eintrag[1] %}
            {% if t >= start and t < horizont_ende %}
              {% set fw.min = p if fw.min is none else ([fw.min, p] | min) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set fenster_min = fw.min %}
        {# 3b. Zweiter Durchlauf: Zukunftsslots im Horizont klassifizieren
           (Midrank-Perzentil, Grenzen unveraendert) UND zusaetzlich oekonomisch
           filtern (p >= fenster_min + aufschlag). Fenster ab der aktuellen
           vollen Stunde: die laufenden Peak-Slots zaehlen mit, damit das Gate
           waehrend der Spitze nicht abfaellt (laufende Stunde konservativ voll
           gerechnet - bei Viertelstundenraster zaehlen dadurch bis zu 3 bereits
           vergangene Slots der laufenden Stunde mit). min_preis_vor_peak_ct
           bezieht sich weiterhin auf die erste GEZAEHLTE (also gefilterte)
           Peak-Stunde. f.ve/f.exp summieren STUNDEN (slot_h je Slot), nicht
           Slot-Anzahlen, da today/tomorrow unterschiedliche slot_h haben
           koennen - deshalb Namespace-Summe statt Zaehler * Konstante. #}
        {% set f = namespace(ve=0.0, exp=0.0, minpre=none, summe=0.0, anz=0, peak_gesehen=false, ve_summe=0.0, ve_anz=0) %}
        {% if n >= 4 %}
          {% for eintrag in ns.future %}
            {% set t = eintrag[0] %}
            {% set p = eintrag[1] %}
            {% set slot_h = eintrag[2] %}
            {% if t >= start and t < horizont_ende %}
              {% set kleiner = ns.prices | select('lt', p) | list | length %}
              {% set gleich  = ns.prices | select('eq', p) | list | length %}
              {% set pct = (kleiner + 0.5 * gleich) / n %}
              {% set ist_peak_preis = fenster_min is none or p >= fenster_min + aufschlag %}
              {% if pct >= 0.80 and ist_peak_preis %}
                {% set f.ve = f.ve + slot_h %}{% set f.summe = f.summe + p %}{% set f.anz = f.anz + 1 %}{% set f.peak_gesehen = true %}
                {% set f.ve_summe = f.ve_summe + p %}{% set f.ve_anz = f.ve_anz + 1 %}
              {% elif pct >= 0.60 and ist_peak_preis %}
                {% set f.exp = f.exp + slot_h %}{% set f.summe = f.summe + p %}{% set f.anz = f.anz + 1 %}{% set f.peak_gesehen = true %}
              {% elif not f.peak_gesehen %}
                {% set f.minpre = p if f.minpre is none else ([f.minpre, p] | min) %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# 4. Reserve in kWh und SoC (mit Entladeverlusten), Kappung bei maxsoc.
           f.ve/f.exp sind bereits Stunden-Summen (siehe 3b), also direkt mit
           verbrauch_kw multiplizieren statt mit einer Slot-Anzahl. #}
        {% set ve_kwh = f.ve * verbrauch_kw / eta %}
        {% set ges_kwh = (f.ve + f.exp) * verbrauch_kw / eta %}
        {% if cap_kwh > 0 %}
          {% set ve_soc = [min_soc + ve_kwh / cap_kwh * 100, max_soc] | min %}
          {% set ges_soc = [min_soc + ges_kwh / cap_kwh * 100, max_soc] | min %}
        {% else %}
          {% set ve_soc = max_soc %}
          {% set ges_soc = max_soc %}
        {% endif %}
        {{ {'gueltig': n >= 4,
            've_soc': ve_soc | round(1),
            'ges_soc': ges_soc | round(1),
            've_stunden': f.ve | round(2),
            'exp_stunden': f.exp | round(2),
            'benoetigt_kwh': ges_kwh | round(2),
            'min_preis_vor_peak_ct': (f.minpre | round(2)) if f.minpre is not none else none,
            'peak_preis_avg_ct': ((f.summe / f.anz) | round(2)) if f.anz > 0 else none,
            've_preis_avg_ct': ((f.ve_summe / f.ve_anz) | round(2)) if f.ve_anz > 0 else none,
            'fenster_min_ct': (fenster_min | round(2)) if fenster_min is not none else none,
            'horizont_ende': horizont_ende.isoformat(),
            'branch': 've=' ~ f.ve ~ ' exp=' ~ f.exp ~ ' n=' ~ n ~ ' ende=' ~ horizont_ende.strftime('%d.%m %H:%M')} }}
    sensor:
      - unique_id: opti_peak_reserve_soc
        name: "Opti Peak Reserve SoC"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-lock
        availability: "{{ peak.gueltig and has_value('sensor.opti_battery_capacity_kwh') }}"
        state: "{{ peak.ges_soc }}"
        attributes:
          reserve_ve_soc: "{{ peak.ve_soc }}"
          peak_stunden_ve: "{{ peak.ve_stunden }}"
          peak_stunden_exp: "{{ peak.exp_stunden }}"
          benoetigt_kwh: "{{ peak.benoetigt_kwh }}"
          min_preis_vor_peak_ct: "{{ peak.min_preis_vor_peak_ct }}"
          peak_preis_avg_ct: "{{ peak.peak_preis_avg_ct }}"
          peak_preis_ve_avg_ct: "{{ peak.ve_preis_avg_ct }}"
          fenster_min_ct: "{{ peak.fenster_min_ct }}"
          horizont_ende: "{{ peak.horizont_ende }}"
          branch: "{{ peak.branch }}"
    binary_sensor:
      - unique_id: opti_peak_reserve_aktiv
        name: "Opti Peak Reserve Aktiv"
        icon: mdi:shield-lock
        state: >
          {{ peak.gueltig and has_value('sensor.opti_battery_capacity_kwh')
             and peak.benoetigt_kwh > 0 }}
