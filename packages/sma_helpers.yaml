# =============================================================================
# SMA Akkusteuerung – Input Helpers & Counter
# =============================================================================
# Alle Hilfs-Entitäten für die Akkusteuerung.
# Diese Datei muss einmalig eingebunden werden – danach werden alle nötigen
# Entitäten automatisch in HA angelegt.
#
# ⚙️  Nichts anpassen – die Standardwerte sind ein guter Ausgangspunkt.
#     Werte später über die HA-Oberfläche feinjustieren.
# =============================================================================

input_select:
  akkusteuerung_modus:
    name: "Akkusteuerung Modus"
    options:
      - "Akku Automatisch"
      - "Akku schnell Laden"
      - "Akku schnell Entladen"
      - "Akku Pause"
      - "Akku nur Laden"
      - "Akku Netzladen" # Erzwungenes dynamisches Netzladen (BatChaMinW = opti_charge_power_w); braucht ha-modbus-akku-adapter >= v1.5.0
      - "Akku nur Entladen"
      - "Akku Dynamisch"
      - "Akku 0.2C Laden"
    initial: "Akku Automatisch"
    icon: mdi:battery-charging

input_number:
  # --- Ladeleistungen ---
  akkusteuerung_ladestaerke_soll:
    name: "Akkusteuerung Ladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-up

  # Hinweis: Für den Modus "Akku 0.2C Laden" ist kein Ladestärke-Helfer mehr nötig.
  # Der Hardware-Adapter (ha-modbus-akku-adapter) berechnet die 0.2C-Ladeleistung
  # automatisch aus der Batterie-Nennkapazität (0,2 × Kapazität, Register 40187).

  akkusteuerung_min_ladestaerke:
    name: "Akkusteuerung Min Ladestärke"
    min: 0
    max: 2000
    step: 50
    initial: 0
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_ladestaerke:
    name: "Akkusteuerung Max Ladestärke"
    min: 0
    max: 10000
    step: 100
    initial: 5000
    unit_of_measurement: W
    mode: box

  # --- Entladeleistungen ---
  akkusteuerung_entladestaerke_soll:
    name: "Akkusteuerung Entladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-down

  akkusteuerung_min_entladestaerke:
    name: "Akkusteuerung Min Entladestärke"
    min: 0
    max: 2000
    step: 50
    initial: 0
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_entladestaerke:
    name: "Akkusteuerung Max Entladestärke"
    min: 0
    max: 10000
    step: 100
    initial: 5000
    unit_of_measurement: W
    mode: box

  # --- Überschuss-Grenzen (für Opti-Automatik) ---
  akkusteuerung_wr_ac_ueberschuss_grenze:
    name: "Akkusteuerung AC-Überschuss Grenze"
    min: 0
    max: 15000
    step: 100
    initial: 4500
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export

  akkusteuerung_wr_70proz_ueberschuss_grenze:
    name: "Akkusteuerung 70%-Überschuss Grenze"
    min: 0
    max: 15000
    step: 100
    initial: 500
    unit_of_measurement: W
    mode: box

  # --- SoC-Grenzen ---
  minsoc:
    name: "Akku Min SoC"
    min: 0
    max: 100
    step: 1
    initial: 10
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-low

  maxsoc:
    name: "Akku Max SoC"
    min: 0
    max: 100
    step: 1
    initial: 95
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-high

  # --- Preisladen & Mindestentladepreis ---
  ladepreis:
    name: "Akku Ladepreis (Referenz)"
    # Wird automatisch vom aktuellen Strompreis befüllt wenn Netzladen aktiv ist.
    # Stellt den Preis dar, zu dem der Akku zuletzt netzgeladen wurde (EUR/kWh).
    # EINHEIT EUR/kWh (z.B. 0.306). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:currency-eur

  mindestpreisdifferenz_lade_entladepreis:
    name: "Mindestpreisdifferenz Laden/Entladen"
    # Mindest-Marge zwischen Ladepreis und aktuellem Preis, ab der Entladen wirtschaftlich ist.
    # Beispiel: Ladepreis 0.20 € + Differenz 0.05 € → Entladen erst ab 0.25 €/kWh sinnvoll.
    # Empfehlung: 0.03–0.08 EUR/kWh (deckt Verluste + Akkuverschleiß ab)
    # EINHEIT EUR/kWh (z.B. 0.08). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 0.3
    step: 0.005
    initial: 0.05
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:cash-plus

  # --- Entlade-Peak-Allokation (Reserve fuer teure Stunden) ---
  opti_peak_verbrauch_kw:
    name: "Opti Peak-Verbrauch"
    # Erwarteter Hausverbrauch waehrend Peak-Stunden (kW). Geht in die
    # Reserve-Rechnung von sensor.opti_peak_reserve_soc ein.
    min: 0.1
    max: 5
    step: 0.1
    initial: 0.8
    unit_of_measurement: kW
    mode: box
    icon: mdi:home-lightning-bolt

  opti_einspeiseverguetung_ct:
    name: "Opti Einspeiseverguetung"
    # Eigene Einspeiseverguetung in ct/kWh. Preis darunter -> Netzladen lohnt immer
    # (Negativpreis-Laderegel). Default 0 = Regel greift nur bei negativen Preisen,
    # bis der echte EEG-Satz eingetragen ist.
    min: 0
    max: 30
    step: 0.1
    initial: 0
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:solar-power-variant

  opti_netzlade_spread_ct:
    name: "Opti Netzlade-Spread"
    # Wirtschaftliche Mindest-Differenz zwischen Peak-Durchschnittspreis und
    # aktuellem Ladepreis (ct/kWh), ab der Peak-Vorladen aus dem Netz lohnt.
    # Deckt Round-Trip-Verluste des Akkus ab.
    min: 0
    max: 100
    step: 0.5
    initial: 10
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:swap-vertical-bold

input_boolean:
  akku_opti_automatik:
    name: "Akku Opti-Automatik"
    icon: mdi:battery-sync

  hausakku_aus_netz_laden:
    name: "Hausakku aus Netz laden"
    icon: mdi:transmission-tower

  hausakku_wurde_netzgeladen:
    name: "Hausakku wurde netzgeladen (Flag)"
    icon: mdi:battery-check

  akku_nach_preis_laden:
    name: "Akku nach Preis laden"
    icon: mdi:currency-eur

  speicher_eco_netzladen:
    name: "Speicher Eco Netzladen"
    icon: mdi:leaf

  # --- Opti Canonical-Layer Gates (Paket 3) ---
  opti_prognose_netzladen:
    name: "Opti Reserve-halten bei schlechter Prognose"
    # Gate für die prognosebasierten "Akku nur Laden"-Blöcke (Entladesperre +
    # nur PV-Überschuss bei schlechter Prognose; KEIN Netzladen). Default an.
    icon: mdi:transmission-tower
    initial: "on"

  opti_pv_ueberschuss_ladung:
    name: "Opti PV-Überschussladung erlauben"
    # Gate für die PV-/AC-Überschussblöcke (Akku Dynamisch). Default an.
    icon: mdi:solar-power
    initial: "on"

counter:
  tage_seit_akku100:
    name: "Tage seit Akku 100%"
    initial: 0
    step: 1
    icon: mdi:counter

# --- Write-on-Change-Helfer für ha-modbus-akku-adapter (ab v1.2.0) ---
# Werden vom Adapter automatisch gepflegt, nicht manuell befüllen.
input_text:
  akkusteuerung_modbus_letzter_schreibwert:
    name: "Akkusteuerung Modbus Letzter Schreibwert"
    max: 255

input_datetime:
  akkusteuerung_modbus_letzter_schreibzeitpunkt:
    name: "Akkusteuerung Modbus Letzter Schreibzeitpunkt"
    has_date: true
    has_time: true

# =============================================================================
# MANUELL ÜBER DIE HA-OBERFLÄCHE ANLEGEN (nicht per YAML möglich)
# =============================================================================
#
# sensor.mindestentladepreis  –  Min/Max-Sensor (Summe)
# -------------------------------------------------------
# Dieser Sensor berechnet den Mindestpreis, ab dem das Entladen wirtschaftlich ist:
#
#   Mindestentladepreis = Ladepreis + Mindestpreisdifferenz
#
# Anlegen unter: Einstellungen → Geräte & Dienste → Helfer → + Helfer hinzufügen
#                → Min/Max
#
#   Name:        Mindestentladepreis
#   Typ:         Summe
#   Entitäten:   input_number.ladepreis
#                input_number.mindestpreisdifferenz_lade_entladepreis
#
# Ergebnis: sensor.mindestentladepreis  (wird in der Opti-Automatik als
# Entladeschwelle verwendet: Entladen nur wenn aktueller Strompreis ≥ diesem Wert)
# =============================================================================
