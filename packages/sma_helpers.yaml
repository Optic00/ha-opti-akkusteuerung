# =============================================================================
# SMA Akkusteuerung – Input Helpers & Counter
# =============================================================================
# Alle Hilfs-Entitäten für die Akkusteuerung.
# Diese Datei muss einmalig eingebunden werden – danach werden alle nötigen
# Entitäten automatisch in HA angelegt.
#
# ⚙️  WICHTIG: Diese Helfer haben bewusst KEIN `initial:` (siehe Hinweis unten) -
#     ohne `initial:` starten frisch angelegte input_number auf ihrem Minimum,
#     z.B. maxsoc = 0%, akkusteuerung_max_ladestaerke = 0 W. Nach dem ersten
#     Anlegen daher einmalig die Erststart-Werte aus der Tabelle im README
#     (Abschnitt "Schnell-Nachbau über Packages") über die HA-Oberfläche setzen.
# Hinweis: `initial` greift NUR beim allerersten Anlegen eines Helfers.
#     Danach restauriert HA bei jedem Neustart den zuletzt gespeicherten Wert.
#     Genau deshalb wurde `initial:` hier bewusst NICHT gesetzt (PR #21) - sonst
#     würde HA bei jedem Neustart die eigenen, per Hand gesetzten Werte verwerfen.
# =============================================================================

input_select:
  akkusteuerung_modus:
    name: "Akkusteuerung Modus"
    options:
      - "Akku Automatisch"
      - "Akku schnell Laden"
      - "Akku schnell Entladen"
      - "Akku Pause"
      - "Akku nur Laden"
      - "Akku Netzladen" # Erzwungenes dynamisches Netzladen (BatChaMinW = opti_charge_power_w); braucht ha-modbus-akku-adapter >= v1.5.0
      - "Akku nur Entladen"
      - "Akku Dynamisch"
      - "Akku 0.2C Laden"
    icon: mdi:battery-charging

input_number:
  # --- Ladeleistungen ---
  akkusteuerung_ladestaerke_soll:
    name: "Akkusteuerung Ladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-up

  # Hinweis: Für den Modus "Akku 0.2C Laden" ist kein Ladestärke-Helfer mehr nötig.
  # Der Hardware-Adapter (ha-modbus-akku-adapter) berechnet die 0.2C-Ladeleistung
  # automatisch aus der Batterie-Nennkapazität (0,2 × Kapazität, Register 40187).

  akkusteuerung_min_ladestaerke:
    name: "Akkusteuerung Min Ladestärke"
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_ladestaerke:
    name: "Akkusteuerung Max Ladestärke"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box

  # --- Entladeleistungen ---
  akkusteuerung_entladestaerke_soll:
    name: "Akkusteuerung Entladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-down

  akkusteuerung_min_entladestaerke:
    name: "Akkusteuerung Min Entladestärke"
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_entladestaerke:
    name: "Akkusteuerung Max Entladestärke"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box

  # --- Überschuss-Grenzen (für Opti-Automatik) ---
  akkusteuerung_wr_ac_ueberschuss_grenze:
    name: "Akkusteuerung AC-Überschuss Grenze"
    min: 0
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export

  akkusteuerung_wr_70proz_ueberschuss_grenze:
    name: "Akkusteuerung 70%-Überschuss Grenze"
    min: 0
    # 25000: 15000 konnte die 70%-Grenze von Anlagen ueber ~21 kWp
    # nicht abbilden.
    max: 25000
    step: 100
    unit_of_measurement: W
    mode: box

  # --- SoC-Grenzen ---
  minsoc:
    name: "Akku Min SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-low

  maxsoc:
    name: "Akku Max SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-high

  # --- Preisladen & Mindestentladepreis ---
  ladepreis:
    name: "Akku Ladepreis (Referenz)"
    # Wird automatisch vom aktuellen Strompreis befüllt wenn Netzladen aktiv ist.
    # Stellt den Preis dar, zu dem der Akku zuletzt netzgeladen wurde (EUR/kWh).
    # EINHEIT EUR/kWh (z.B. 0.306). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:currency-eur

  mindestpreisdifferenz_lade_entladepreis:
    name: "Mindestpreisdifferenz Laden/Entladen"
    # Mindest-Marge zwischen Ladepreis und aktuellem Preis, ab der Entladen wirtschaftlich ist.
    # Beispiel: Ladepreis 0.20 € + Differenz 0.05 € → Entladen erst ab 0.25 €/kWh sinnvoll.
    # Empfehlung: 0.03–0.08 EUR/kWh (deckt Verluste + Akkuverschleiß ab)
    # EINHEIT EUR/kWh (z.B. 0.08). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 0.3
    step: 0.005
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:cash-plus

  # --- Entlade-Peak-Allokation (Reserve fuer teure Stunden) ---
  opti_peak_verbrauch_kw:
    name: "Opti Peak-Verbrauch"
    # Erwarteter Hausverbrauch waehrend Peak-Stunden (kW). Geht in die
    # Reserve-Rechnung von sensor.opti_peak_reserve_soc ein.
    min: 0.1
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
    icon: mdi:home-lightning-bolt

  opti_einspeiseverguetung_ct:
    name: "Opti Einspeiseverguetung"
    # Eigene Einspeiseverguetung in ct/kWh. Preis darunter -> Netzladen lohnt immer
    # (Negativpreis-Laderegel). Default 0 = Regel greift nur bei negativen Preisen,
    # bis der echte EEG-Satz eingetragen ist.
    min: 0
    max: 30
    step: 0.1
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:solar-power-variant

  opti_netzlade_spread_ct:
    name: "Opti Netzlade-Spread"
    # Wirtschaftliche Mindest-Differenz zwischen Peak-Durchschnittspreis und
    # aktuellem Ladepreis (ct/kWh), ab der Peak-Vorladen aus dem Netz lohnt.
    # Deckt Round-Trip-Verluste des Akkus ab.
    # Winter-Backtest-Sweep (2026-07-02): 10 bestaetigt (15 drueckt die
    # VE-Abdeckung unter die Vorgabe >= 31.2%).
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:swap-vertical-bold

  opti_peak_min_aufschlag_ct:
    name: "Opti Peak Mindestaufschlag"
    # Eine Stunde zaehlt nur als Peak (VE/EXP) fuer die Reserve, wenn ihr Preis
    # das Horizont-Tief (fenster_min_ct) um mindestens diesen Aufschlag
    # uebersteigt - filtert die Perzentil-Zwangs-Peaks flacher Tage raus
    # (z.B. 30.0 vs 30.5 ct waeren sonst schon ein "Peak"). UND-Bedingung
    # zusaetzlich zu den unveraenderten Perzentil-Grenzen.
    # Empfohlener Startwert aus dem Winter-Backtest-Sweep (2026-07-02): 5.
    # (Sweep 0/5/10/15: 5 ist der guenstigste Wert, der die VE-Abdeckungs-
    # Vorgabe >= 31.2% haelt; ab 10 faellt die Abdeckung unter die Vorgabe.)
    # Der Template-Fallback von 10 ct (opti_derived.yaml) greift NUR, wenn dieser
    # Helfer gar nicht existiert. Ist er einmal angelegt, gewinnt sein Wert immer -
    # auch der Erststart-Wert 0. Nach dem Anlegen aktiv auf 5 setzen.
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:filter-outline

  opti_forecast_optimismus:
    name: "Opti Forecast-Optimismus"
    # Blend-Regler zwischen konservativem P10 und Median der Solcast-Rest-
    # prognose (sensor.opti_forecast_effective_remaining_kwh). alpha=0
    # (Erststart, kein initial gesetzt) -> min(median, P10), heutiges
    # Verhalten. alpha=50 -> (median+P10)/2. alpha=100 -> reiner Median
    # (optimistisch: Ziel-SoC steigt spaeter, Akku wird weniger frueh voll).
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:weather-sunny

  opti_halte_spread_ct:
    name: "Opti Halte-Spread"
    # L3 haelt bei EXPENSIVE nur noch, wenn der Preisdurchschnitt der
    # kommenden VERY_EXPENSIVE-Stunden (peak_preis_ve_avg_ct) mindestens
    # diesen Aufschlag ueber dem aktuellen Preis liegt - Halten ohne echten
    # VE-Vorteil kostet nur Netzbezug ohne Gegenwert.
    # Empfohlener Startwert aus dem Winter-Backtest-Sweep (2026-07-02): 5.
    # (Sweep 0/3/5 bei aufschlag 5: 5 war die guenstigste Variante bei
    # praktisch gleicher VE-Abdeckung.)
    # Der Template-Fallback von 3 ct (opti_derived.yaml) greift NUR, wenn dieser
    # Helfer gar nicht existiert. Ist er einmal angelegt, gewinnt sein Wert immer -
    # auch der Erststart-Wert 0. Nach dem Anlegen aktiv auf 5 setzen.
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:hand-back-right-outline

  # --- Balancing-/Deep-Charge-Watchdog (Feature #31) ---
  # Laedt den Akku gezielt einmalig auf ~100%, wenn er zu lange nicht mehr voll
  # war, damit das BMS balancen/kalibrieren kann. Rein abgeleitet ueber
  # sensor.opti_balancing_watchdog (kein gelatchtes Flag -> restart-durabel).
  opti_balancing_intervall_tage:
    name: "Opti Balancing Intervall"
    # Tage ohne Voll-/Done-Ladung, ab denen der Watchdog faellig wird.
    # Dokumentierter Startwert 14; 0 = Watchdog komplett aus (Erststart-Wert
    # ohne initial = Minimum 0 = fail-safe aus). Nach Anlegen auf 14 setzen.
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "Tage"
    mode: box
    icon: mdi:calendar-refresh

  opti_balancing_karenz_tage:
    name: "Opti Balancing Karenz"
    # Zusaetzliche Karenz-Tage nach Faelligkeit, bevor der bezahlte Netz-
    # Fallback (guenstiges Netzladen) erlaubt wird. Startwert 3.
    min: 0
    max: 14
    step: 1
    unit_of_measurement: "Tage"
    mode: box
    icon: mdi:timer-sand

  opti_balancing_max_ct:
    name: "Opti Balancing Preisdeckel"
    # Absoluter Brutto-Preisdeckel (ct/kWh) fuers bezahlte Balancing-Netzladen.
    # Erststart 0 = fail-safe = KEIN bezahltes Netzladen (nur PV + Gratis-/
    # Negativ-Netz). Nach Anlegen auf 25 setzen; 0 laesst den bezahlten
    # Netz-Fallback aus.
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:cash-lock

  opti_balancing_done_soc:
    name: "Opti Balancing Done-SoC"
    # Schwelle (%), ab der ein Balancing-Zyklus als erledigt gilt: der Counter
    # tage_seit_akku100 wird ab hier (30 min stabil) zurueckgesetzt, das
    # taegliche Increment zaehlt nur unterhalb weiter. HIER ist 0 NICHT
    # fail-safe, daher expliziter initial-Wert.
    initial: 98.5
    min: 90
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-heart-variant

input_boolean:
  akku_opti_automatik:
    name: "Akku Opti-Automatik"
    icon: mdi:battery-sync

  hausakku_aus_netz_laden:
    name: "Hausakku aus Netz laden"
    icon: mdi:transmission-tower

  hausakku_wurde_netzgeladen:
    name: "Hausakku wurde netzgeladen (Flag)"
    icon: mdi:battery-check

  akku_nach_preis_laden:
    name: "Akku nach Preis laden"
    icon: mdi:currency-eur

  speicher_eco_netzladen:
    name: "Speicher Eco Netzladen"
    icon: mdi:leaf

  # --- Opti Canonical-Layer Gates (Paket 3) ---
  opti_prognose_netzladen:
    name: "Opti Reserve-halten bei schlechter Prognose"
    # Gate für die prognosebasierten "Akku nur Laden"-Blöcke (Entladesperre +
    # nur PV-Überschuss bei schlechter Prognose; KEIN Netzladen). Default an.
    icon: mdi:transmission-tower

  opti_pv_ueberschuss_ladung:
    name: "Opti PV-Überschussladung erlauben"
    # Gate für die PV-/AC-Überschussblöcke (Akku Dynamisch). Default an.
    icon: mdi:solar-power

counter:
  tage_seit_akku100:
    name: "Tage seit Akku 100%"
    initial: 0
    step: 1
    icon: mdi:counter

# --- Write-on-Change-Helfer für ha-modbus-akku-adapter (ab v1.2.0) ---
# Werden vom Adapter automatisch gepflegt, nicht manuell befüllen.
input_text:
  akkusteuerung_modbus_letzter_schreibwert:
    name: "Akkusteuerung Modbus Letzter Schreibwert"
    max: 255

input_datetime:
  akkusteuerung_modbus_letzter_schreibzeitpunkt:
    name: "Akkusteuerung Modbus Letzter Schreibzeitpunkt"
    has_date: true
    has_time: true
