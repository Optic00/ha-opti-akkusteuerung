# =============================================================================
# SMA Akkusteuerung – Input Helpers & Counter
# =============================================================================
# Alle Hilfs-Entitäten für die Akkusteuerung.
# Diese Datei muss einmalig eingebunden werden – danach werden alle nötigen
# Entitäten automatisch in HA angelegt.
#
# ⚙️  WICHTIG: Die benutzerkonfigurierbaren Helfer haben bewusst KEIN `initial:`.
#     Ohne `initial:` restauriert HA nach Neustarts den zuletzt gespeicherten
#     Wert; frisch angelegte input_number starten auf ihrem Minimum. Daher nach
#     dem ersten Anlegen einmalig die Erststart-Werte aus der Tabelle im README
#     (Abschnitt "Schnell-Nachbau über Packages") über die HA-Oberfläche setzen.
#     Ein vorhandenes `initial:` greift dagegen bei JEDEM HA-Start und verhindert
#     die Wiederherstellung manueller Änderungen. Es wird unten nur dort benutzt,
#     wo dieses feste Restart-Verhalten ausdrücklich Teil des Vertrags ist.
# =============================================================================

input_select:
  akkusteuerung_modus:
    name: "Akkusteuerung Modus"
    options:
      - "Akku Automatisch"
      - "Akku schnell Laden"
      - "Akku schnell Entladen"
      - "Akku Pause"
      - "Akku nur Laden"
      - "Akku Netzladen" # Erzwungenes dynamisches Netzladen (BatChaMinW = opti_charge_power_w); braucht ha-modbus-akku-adapter >= v1.5.0
      - "Akku nur Entladen"
      - "Akku Dynamisch"
      - "Akku 0.2C Laden"
    icon: mdi:battery-charging

input_number:
  # --- Ladeleistungen ---
  akkusteuerung_ladestaerke_soll:
    name: "Akkusteuerung Ladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-up

  # Hinweis: Für den Modus "Akku 0.2C Laden" ist kein Ladestärke-Helfer mehr nötig.
  # Der Hardware-Adapter (ha-modbus-akku-adapter) berechnet die 0.2C-Ladeleistung
  # automatisch aus der Batterie-Nennkapazität (0,2 × Kapazität, Register 40187).

  akkusteuerung_min_ladestaerke:
    name: "Akkusteuerung Min Ladestärke"
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_ladestaerke:
    name: "Akkusteuerung Max Ladestärke"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box

  # --- Entladeleistungen ---
  akkusteuerung_entladestaerke_soll:
    name: "Akkusteuerung Entladestärke Soll"
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-down

  akkusteuerung_min_entladestaerke:
    name: "Akkusteuerung Min Entladestärke"
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_entladestaerke:
    name: "Akkusteuerung Max Entladestärke"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box

  # --- Überschuss-Grenzen (für Opti-Automatik) ---
  akkusteuerung_wr_ac_ueberschuss_grenze:
    name: "Akkusteuerung AC-Überschuss Grenze"
    min: 0
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export

  akkusteuerung_wr_70proz_ueberschuss_grenze:
    name: "Akkusteuerung 70%-Überschuss Grenze"
    min: 0
    # 25000: 15000 konnte die 70%-Grenze von Anlagen ueber ~21 kWp
    # nicht abbilden.
    max: 25000
    step: 100
    unit_of_measurement: W
    mode: box

  # Wirtschaftliches Ueberschuss-Veto (2026-08-15): die beiden Grenzen oben sind
  # ABREGELUNGS-Schwellen (70%-Einspeiselimit, WR-AC-Grenze) und liegen bei einer
  # Anlage mit ~8 kW Peak so hoch, dass ihre Signale nie ausloesen. Diese Grenze
  # ist die wirtschaftliche Leistungsschwelle. Bei prognostizierter Knappheit ist
  # jede kWh, die bei laufendem Netzexport NICHT in den Akku geht,
  # Einspeiseverguetung statt Abendpreis - am 15.08.2026 gingen so 19,3 kWh ins
  # Netz, waehrend der Ziel-SoC-Deckel den Akku ~2,5 h auf Ladeleistung 0 zwang.
  # An einem Reichtag sperrt der Knappheits-Faktor unten dieses Veto dagegen.
  # min bewusst 200 statt 0: ein input_number ohne gespeicherten Zustand startet
  # auf seinem Minimum. Kein `initial:` - das ueberschriebe den restaurierten Wert
  # bei JEDEM Neustart (dieselbe Falle, die am Modus-Select entfernt wurde). Der
  # Erststart-Wert muss deshalb ueber `min` brauchbar sein. Empfohlener
  # Betriebswert: 500 W.
  akkusteuerung_ueberschuss_veto_grenze:
    name: "Akkusteuerung Überschuss-Veto Grenze"
    min: 200
    max: 5000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export

  # Ausschaltschwelle des Vetos (Hysterese-Unterkante). Bewusst als eigener
  # Helfer statt fester Differenz: der Abstand zur Einschaltgrenze muss die
  # Messpunkt-Unschaerfe zwischen DC-Batterieleistung und AC-Export abdecken
  # (Wandlungsverluste ~5-10 %, bei Volllast bis ~200 W).
  # min 100 aus demselben Grund: beim Erststart faellt der Helfer sonst auf 0 und
  # das Halteband waere wirkungslos (das Template wertet `aus > 0` aus).
  # Empfohlener Betriebswert: 250 W.
  akkusteuerung_ueberschuss_veto_aus_grenze:
    name: "Akkusteuerung Überschuss-Veto Aus-Grenze"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export

  # Knappheits-Gate fuer das Ueberschuss-Veto (2026-08-16): das Veto sticht den
  # Ziel-SoC nur noch, wenn der prognostizierte Rest-Ueberschuss des Tages kleiner
  # ist als dieser Faktor mal der Energiebedarf bis Akku voll. Kein `initial:` -
  # das ueberschriebe den restaurierten Wert bei jedem Neustart. Der Erststart
  # faellt deshalb auf min 1: Veto nur bei echter Unterdeckung, also die
  # konservativste Einstellung in Richtung Ziel-SoC-Rampe. Empfohlener
  # Betriebswert: 3 als Pessimismus-Puffer gegen Forecast-Optimismus, belegt am
  # Knappheitstag 15.08.2026.
  akkusteuerung_ueberschuss_veto_knappheit_faktor:
    name: "Akkusteuerung Überschuss-Veto Knappheits-Faktor"
    min: 1
    max: 10
    step: 0.5
    mode: box
    icon: mdi:scale-balance

  # --- SoC-Grenzen ---
  minsoc:
    name: "Akku Min SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-low

  maxsoc:
    name: "Akku Max SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-high

  # --- Preisladen & Mindestentladepreis ---
  ladepreis:
    name: "Akku Ladepreis (Referenz)"
    # Wird automatisch vom aktuellen Strompreis befüllt wenn Netzladen aktiv ist.
    # Stellt den Preis dar, zu dem der Akku zuletzt netzgeladen wurde (EUR/kWh).
    # EINHEIT EUR/kWh (z.B. 0.306). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:currency-eur

  mindestpreisdifferenz_lade_entladepreis:
    name: "Mindestpreisdifferenz Laden/Entladen"
    # Mindest-Marge zwischen Ladepreis und aktuellem Preis, ab der Entladen wirtschaftlich ist.
    # Beispiel: Ladepreis 0.20 € + Differenz 0.05 € → Entladen erst ab 0.25 €/kWh sinnvoll.
    # Empfehlung: 0.03–0.08 EUR/kWh (deckt Verluste + Akkuverschleiß ab)
    # EINHEIT EUR/kWh (z.B. 0.08). opti_mindestentladepreis_ct_kwh rechnet ×100 nach ct.
    min: 0
    max: 0.3
    step: 0.005
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:cash-plus

  # --- Entlade-Peak-Allokation (Reserve fuer teure Stunden) ---
  opti_peak_verbrauch_kw:
    name: "Opti Peak-Verbrauch"
    # Erwarteter Hausverbrauch waehrend Peak-Stunden (kW). Geht in die
    # Reserve-Rechnung von sensor.opti_peak_reserve_soc ein.
    min: 0.1
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
    icon: mdi:home-lightning-bolt

  opti_einspeiseverguetung_ct:
    name: "Opti Einspeiseverguetung"
    # Eigene Einspeiseverguetung in ct/kWh. Preis darunter -> Netzladen lohnt immer
    # (Negativpreis-Laderegel). Default 0 = Regel greift nur bei negativen Preisen,
    # bis der echte EEG-Satz eingetragen ist.
    min: 0
    max: 30
    step: 0.1
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:solar-power-variant

  opti_netzlade_spread_ct:
    name: "Opti Netzlade-Spread"
    # Wirtschaftliche Mindest-Differenz zwischen Peak-Durchschnittspreis und
    # aktuellem Ladepreis (ct/kWh), ab der Peak-Vorladen aus dem Netz lohnt.
    # Deckt Round-Trip-Verluste des Akkus ab.
    # Winter-Backtest-Sweep (2026-07-02): 10 bestaetigt (15 drueckt die
    # VE-Abdeckung unter die Vorgabe >= 31.2%).
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:swap-vertical-bold

  opti_peak_min_aufschlag_ct:
    name: "Opti Peak Mindestaufschlag"
    # Eine Stunde zaehlt nur als Peak (VE/EXP) fuer die Reserve, wenn ihr Preis
    # das Horizont-Tief (fenster_min_ct) um mindestens diesen Aufschlag
    # uebersteigt - filtert die Perzentil-Zwangs-Peaks flacher Tage raus
    # (z.B. 30.0 vs 30.5 ct waeren sonst schon ein "Peak"). UND-Bedingung
    # zusaetzlich zu den unveraenderten Perzentil-Grenzen.
    # Empfohlener Startwert aus dem Winter-Backtest-Sweep (2026-07-02): 5.
    # (Sweep 0/5/10/15: 5 ist der guenstigste Wert, der die VE-Abdeckungs-
    # Vorgabe >= 31.2% haelt; ab 10 faellt die Abdeckung unter die Vorgabe.)
    # Der Template-Fallback von 10 ct (opti_derived.yaml) greift NUR, wenn dieser
    # Helfer gar nicht existiert. Ist er einmal angelegt, gewinnt sein Wert immer -
    # auch der Erststart-Wert 0. Nach dem Anlegen aktiv auf 5 setzen.
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:filter-outline

  opti_forecast_optimismus:
    name: "Opti Forecast-Optimismus"
    # Blend-Regler zwischen konservativem P10 und Median der Solcast-Rest-
    # prognose (sensor.opti_forecast_effective_remaining_kwh). alpha=0
    # (Erststart, kein initial gesetzt) -> min(median, P10), heutiges
    # Verhalten. alpha=50 -> (median+P10)/2. alpha=100 -> reiner Median
    # (optimistisch: Ziel-SoC steigt spaeter, Akku wird weniger frueh voll).
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:weather-sunny

  opti_halte_spread_ct:
    name: "Opti Halte-Spread"
    # L3 haelt bei EXPENSIVE nur noch, wenn der Preisdurchschnitt der
    # kommenden VERY_EXPENSIVE-Stunden (peak_preis_ve_avg_ct) mindestens
    # diesen Aufschlag ueber dem aktuellen Preis liegt - Halten ohne echten
    # VE-Vorteil kostet nur Netzbezug ohne Gegenwert.
    # Empfohlener Startwert aus dem Winter-Backtest-Sweep (2026-07-02): 5.
    # (Sweep 0/3/5 bei aufschlag 5: 5 war die guenstigste Variante bei
    # praktisch gleicher VE-Abdeckung.)
    # Der Template-Fallback von 3 ct (opti_derived.yaml) greift NUR, wenn dieser
    # Helfer gar nicht existiert. Ist er einmal angelegt, gewinnt sein Wert immer -
    # auch der Erststart-Wert 0. Nach dem Anlegen aktiv auf 5 setzen.
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:hand-back-right-outline

  # --- Balancing-/Deep-Charge-Watchdog (Feature #31) ---
  # Laedt den Akku gezielt einmalig auf ~100%, wenn er zu lange nicht mehr voll
  # war, damit das BMS balancen/kalibrieren kann. Rein abgeleitet ueber
  # sensor.opti_balancing_watchdog (kein gelatchtes Flag -> restart-durabel).
  opti_balancing_intervall_tage:
    name: "Opti Balancing Intervall"
    # Tage ohne Voll-/Done-Ladung, ab denen der Watchdog faellig wird (Zeit-Pfad).
    # 7 = woechentlich (frische Zell-Balance/SoC-Kalibrierung, LFP-typisch),
    # 14 = schonender (weniger 100%-Zyklen). Der Bedarfs-Pfad
    # (opti_balancing_spreizungs_schwelle) zieht bei driftenden Zellen frueher -
    # bei langem Intervall entfaltet er mehr Wirkung. 0 = Watchdog komplett aus
    # (beide Pfade; Erststart-Wert ohne initial = Minimum 0 = fail-safe aus).
    # Nach Anlegen sinnvoll setzen (Referenzanlage laeuft mit 7).
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "Tage"
    mode: box
    icon: mdi:calendar-refresh

  opti_balancing_karenz_tage:
    name: "Opti Balancing Karenz"
    # Zusaetzliche Karenz-Tage nach Faelligkeit, bevor der bezahlte Netz-
    # Fallback (guenstiges Netzladen) erlaubt wird. Startwert 3.
    min: 0
    max: 14
    step: 1
    unit_of_measurement: "Tage"
    mode: box
    icon: mdi:timer-sand

  opti_balancing_max_ct:
    name: "Opti Balancing Preisdeckel"
    # Absoluter Brutto-Preisdeckel (ct/kWh) fuers bezahlte Balancing-Netzladen.
    # Erststart 0 = fail-safe = KEIN bezahltes Netzladen (nur PV + Gratis-/
    # Negativ-Netz). Nach Anlegen auf 25 setzen; 0 laesst den bezahlten
    # Netz-Fallback aus.
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:cash-lock

  opti_balancing_done_soc:
    name: "Opti Balancing Done-SoC"
    # Schwelle (%), ab der ein Balancing-Zyklus als erledigt gilt: der Counter
    # tage_seit_akku100 wird ab hier (30 min stabil) zurueckgesetzt, das
    # taegliche Increment zaehlt nur unterhalb weiter. Das Minimum 90 waere fuer
    # diesen Sicherheitsvertrag zu niedrig. Der explizite initial-Wert pinnt
    # die Schwelle daher bewusst bei JEDEM HA-Start auf 98.5 %; UI-Aenderungen
    # an genau diesem Helfer sind nicht restart-dauerhaft.
    initial: 98.5
    min: 90
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-heart-variant

  opti_balancing_spreizungs_schwelle:
    name: "Opti Balancing Spreizungs-Schwelle"
    # Bedarfsgesteuertes Balancing: ab dieser Ruhe-Zellspreizung (mV,
    # sensor.byd_zellspreizung_ruhe) wird der Watchdog vorzeitig faellig, auch
    # bevor das Zeit-Intervall ablaeuft (Zellen driften -> vollladen zum Balancen).
    # Bewusst UNTER der Health-Alarm-Schwelle (50 mV) -> max 49. 0 = Bedarfs-
    # Pfad aus (nur Zeit-Intervall). Startwert 35.
    min: 0
    max: 49
    step: 1
    unit_of_measurement: mV
    mode: box
    icon: mdi:arrow-collapse-vertical

  opti_balancing_bedarf_cooldown_tage:
    name: "Opti Balancing Bedarf-Cooldown Tage"
    # Mindestabstand (Tage seit letztem Vollzyklus), bevor der Spreizungs-Bedarf
    # erneut einen Zyklus ausloesen darf. Rate-Limit gegen Dauer-100%, falls eine
    # echte Imbalance in einem Zyklus nicht verschwindet. Startwert 5.
    min: 0
    max: 30
    step: 1
    unit_of_measurement: "Tage"
    mode: box
    icon: mdi:timer-sand

input_boolean:
  akku_opti_automatik:
    name: "Akku Opti-Automatik"
    icon: mdi:battery-sync

  hausakku_aus_netz_laden:
    name: "Hausakku aus Netz laden"
    icon: mdi:transmission-tower

  hausakku_wurde_netzgeladen:
    name: "Hausakku wurde netzgeladen (Flag)"
    icon: mdi:battery-check

  akku_nach_preis_laden:
    name: "Akku nach Preis laden"
    icon: mdi:currency-eur

  speicher_eco_netzladen:
    name: "Speicher Eco Netzladen"
    icon: mdi:leaf

  # --- Opti Canonical-Layer Gates (Paket 3) ---
  opti_prognose_netzladen:
    name: "Opti Reserve-halten bei schlechter Prognose"
    # Gate für die prognosebasierten "Akku nur Laden"-Blöcke (Entladesperre +
    # nur PV-Überschuss bei schlechter Prognose; KEIN Netzladen). Default an.
    icon: mdi:transmission-tower

  opti_pv_ueberschuss_ladung:
    name: "Opti PV-Überschussladung erlauben"
    # Gate für die PV-/AC-Überschussblöcke (Akku Dynamisch). Default an.
    icon: mdi:solar-power

  opti_ev_akku_pause:
    name: "Opti EV Akku-Pause"
    # Feature-Schalter der EV-Schnelllade-Entladesperre (optionales Package
    # packages/opti_ev_sperre.yaml, braucht evcc_intg + Ladepunkt-Mapping).
    # Aus = Sperre komplett wirkungslos (Sofort-Notausstieg, wirkt auch
    # waehrend delay_off/Latch des Erkennungssensors). Default AUS.
    icon: mdi:car-electric

  opti_balancing_netzladen:
    name: "Opti Balancing darf ans Netz"
    # Eigener Schalter für den Balancing-/Deep-Charge-Watchdog (Feature #31):
    # erlaubt dem Watchdog, den Akku fürs BMS-Balancing auch AUS DEM NETZ
    # hochzuladen (Gratis-/Negativpreis + bezahlter Fallback unter Deckel).
    # Bewusst entkoppelt von opti_prognose_netzladen, damit die harte
    # Netzlade-Garantie (#26) erhalten bleibt. Default AUS (fail-safe): ohne
    # diesen Schalter balancet der Watchdog rein per PV. PV-Balancing läuft
    # unabhängig davon immer, solange das Intervall > 0 ist.
    icon: mdi:battery-heart-variant

  opti_balancing_abschluss_gueltig:
    name: "Opti Balancing Abschluss gültig"
    # Kennzeichnet, dass der Abschluss-Zeitstempel wirklich von der
    # Balancing-Automation geschrieben wurde. Bewusst KEIN `initial:`:
    # HA restauriert den Zustand; ein neuer Helper startet sicher auf AUS.
    icon: mdi:calendar-check

counter:
  tage_seit_akku100:
    name: "Tage seit Akku 100%"
    # Persistiert die Watchdog-Faelligkeit ueber HA-Neustarts.
    # Erststart ohne gespeicherten Zustand beginnt automatisch bei 0.
    step: 1
    icon: mdi:counter

  opti_balancing_done_minuten:
    name: "Opti Balancing Done-Minuten"
    # Persistente Bestaetigungen fuer den restart-festen Done-SoC-Reset.
    # Bewusst KEIN `initial:`: HA restauriert den Stand nach einem Neustart.
    minimum: 0
    maximum: 30
    step: 1
    icon: mdi:timer-check-outline

# --- Write-on-Change-Helfer für ha-modbus-akku-adapter (ab v1.2.0) ---
# Werden vom Adapter automatisch gepflegt, nicht manuell befüllen.
input_text:
  akkusteuerung_modbus_letzter_schreibwert:
    name: "Akkusteuerung Modbus Letzter Schreibwert"
    max: 255
  # Persistenter Dedupe-Merker fuer native BMS-Warnungen. Bewusst KEIN
  # initial: HA wuerde den Wert bei jedem Neustart ueberschreiben; ohne
  # initial wird der letzte Wert restauriert. Beim Erststart ist der Merker
  # leer, die erste aktive Warnung wird daher einmalig verarbeitet.
  byd_bms_warnung_zuletzt_gemeldet:
    name: "BYD Zuletzt gemeldete BMS-Warnung"
    max: 255

input_datetime:
  opti_balancing_letzter_abschluss:
    name: "Opti Balancing letzter Abschluss"
    # Tages-Latch und belastbarer Verlaufswert fuer Auswertung/KI.
    # Bewusst KEIN `initial:`: HA restauriert den letzten Abschluss.
    has_date: true
    has_time: true

  akkusteuerung_modbus_letzter_schreibzeitpunkt:
    name: "Akkusteuerung Modbus Letzter Schreibzeitpunkt"
    has_date: true
    has_time: true
