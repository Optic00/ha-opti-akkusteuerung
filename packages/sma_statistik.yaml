# =============================================================================
# SMA Akkusteuerung – Statistik-Sensoren
# =============================================================================
# Gleitende Mittelwerte für Batterielast und Hausverbrauch.
# Konsumenten: "Haus Stromverbrauch 60 min" und "House Battery Load 30 mins"
# werden vom Legacy-Layer (sma_templates.yaml) genutzt,
# "Opti House Consumption 60min W" vom Canonical-Layer (opti_derived.yaml).
#
# Eingänge kommen vom Canonical-Layer (opti_mapping.yaml):
#   Batterielast:    sensor.opti_battery_power_w
#                   (positiver Wert = Laden, negativer = Entladung)
#   Haus-Verbrauch:  sensor.opti_house_consumption_w
# Kein manuelles Mapping hier nötig.
# =============================================================================

sensor:
  # sampling_size 360 statt der Fenstergroesse 30 min: bei 5-s-Update-Zyklen der
  # Quelle wuerde ein zu kleiner Puffer das 30-min-Fenster nicht mehr abdecken.
  - platform: statistics
    name: "House Battery Load 30 mins"
    unique_id: house_battery_load_30_mins
    entity_id: sensor.opti_battery_power_w
    state_characteristic: mean
    max_age:
      minutes: 30
    sampling_size: 360
    precision: 0

  - platform: statistics
    name: "Haus Stromverbrauch 60 min"
    unique_id: haus_stromverbrauch_60_min
    entity_id: sensor.opti_house_consumption_w
    state_characteristic: mean
    max_age:
      minutes: 60
    sampling_size: 360
    precision: 0

  # Canonical-Layer-Pendant zu "Haus Stromverbrauch 60 min" (Legacy, s.o.):
  # gleiche Quelle/Fenster, aber unter dem opti_-Namensschema, damit
  # opti_derived.yaml nicht auf einen Legacy-Sensor verweisen muss.
  - platform: statistics
    name: "Opti House Consumption 60min W"
    unique_id: opti_house_consumption_60min_w
    entity_id: sensor.opti_house_consumption_w
    state_characteristic: mean
    max_age:
      minutes: 60
    sampling_size: 1500
    precision: 0
