[project]
name = "ha-opti-akku-hacs"
version = "2026.9-beta3"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
files = [
  "custom_components/opti_akku/command_evidence.py",
  "custom_components/opti_akku/demand_accuracy.py",
  "custom_components/opti_akku/device.py",
  "custom_components/opti_akku/load_profile.py",
  "custom_components/opti_akku/plant.py",
  "custom_components/opti_akku/recovery.py",
  "custom_components/opti_akku/tibber_prices.py",
]
strict = true
follow_imports = "skip"
ignore_missing_imports = true
