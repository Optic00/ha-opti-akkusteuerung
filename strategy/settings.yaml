helper_definitions:
  input_select.akkusteuerung_modus:
    domain: input_select
    name: Akkusteuerung Modus
    options:
    - Akku Automatisch
    - Akku schnell Laden
    - Akku schnell Entladen
    - Akku Pause
    - Akku nur Laden
    - Akku Netzladen
    - Akku nur Entladen
    - Akku Dynamisch
    - Akku 0.2C Laden
    icon: mdi:battery-charging
  input_number.akkusteuerung_ladestaerke_soll:
    domain: input_number
    name: Akkusteuerung Ladestärke Soll
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-up
  input_number.akkusteuerung_min_ladestaerke:
    domain: input_number
    name: Akkusteuerung Min Ladestärke
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box
  input_number.akkusteuerung_max_ladestaerke:
    domain: input_number
    name: Akkusteuerung Max Ladestärke
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: W
    mode: box
  input_number.akkusteuerung_entladestaerke_soll:
    domain: input_number
    name: Akkusteuerung Entladestärke Soll
    min: 100
    max: 10000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-arrow-down
  input_number.akkusteuerung_min_entladestaerke:
    domain: input_number
    name: Akkusteuerung Min Entladestärke
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box
  input_number.akkusteuerung_max_entladestaerke:
    domain: input_number
    name: Akkusteuerung Max Entladestärke
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: W
    mode: box
  input_number.akkusteuerung_wr_ac_ueberschuss_grenze:
    domain: input_number
    name: Akkusteuerung AC-Überschuss Grenze
    min: 0
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export
  input_number.akkusteuerung_wr_70proz_ueberschuss_grenze:
    domain: input_number
    name: Akkusteuerung 70%-Überschuss Grenze
    min: 0
    max: 25000
    step: 100
    unit_of_measurement: W
    mode: box
  input_number.akkusteuerung_ueberschuss_veto_grenze:
    domain: input_number
    name: Akkusteuerung Überschuss-Veto Grenze
    min: 200
    max: 5000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export
  input_number.akkusteuerung_ueberschuss_veto_aus_grenze:
    domain: input_number
    name: Akkusteuerung Überschuss-Veto Aus-Grenze
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-export
  input_number.akkusteuerung_ueberschuss_veto_knappheit_faktor:
    domain: input_number
    name: Akkusteuerung Überschuss-Veto Knappheits-Faktor
    min: 1
    max: 10
    step: 0.5
    mode: box
    icon: mdi:scale-balance
  input_number.minsoc:
    domain: input_number
    name: Akku Min SoC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: '%'
    mode: slider
    icon: mdi:battery-low
  input_number.maxsoc:
    domain: input_number
    name: Akku Max SoC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: '%'
    mode: slider
    icon: mdi:battery-high
  input_number.ladepreis:
    domain: input_number
    name: Akku Ladepreis (Referenz)
    min: -1
    max: 1
    step: 0.001
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:currency-eur
  input_number.mindestpreisdifferenz_lade_entladepreis:
    domain: input_number
    name: Mindestpreisdifferenz Laden/Entladen
    min: 0
    max: 0.3
    step: 0.005
    unit_of_measurement: EUR/kWh
    mode: box
    icon: mdi:cash-plus
  input_number.opti_peak_verbrauch_kw:
    domain: input_number
    name: Opti Peak-Verbrauch
    min: 0.1
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
    icon: mdi:home-lightning-bolt
  input_number.opti_einspeiseverguetung_ct:
    domain: input_number
    name: Opti Einspeiseverguetung
    min: 0
    max: 30
    step: 0.1
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:solar-power-variant
  input_number.opti_netzlade_spread_ct:
    domain: input_number
    name: Opti Netzlade-Spread
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:swap-vertical-bold
  input_number.opti_peak_min_aufschlag_ct:
    domain: input_number
    name: Opti Peak Mindestaufschlag
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:filter-outline
  input_number.opti_forecast_optimismus:
    domain: input_number
    name: Opti Forecast-Optimismus
    min: 0
    max: 100
    step: 5
    unit_of_measurement: '%'
    mode: slider
    icon: mdi:weather-sunny
  input_number.opti_halte_spread_ct:
    domain: input_number
    name: Opti Halte-Spread
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:hand-back-right-outline
  input_number.opti_balancing_intervall_tage:
    domain: input_number
    name: Opti Balancing Intervall
    min: 0
    max: 60
    step: 1
    unit_of_measurement: Tage
    mode: box
    icon: mdi:calendar-refresh
  input_number.opti_balancing_karenz_tage:
    domain: input_number
    name: Opti Balancing Karenz
    min: 0
    max: 14
    step: 1
    unit_of_measurement: Tage
    mode: box
    icon: mdi:timer-sand
  input_number.opti_balancing_max_ct:
    domain: input_number
    name: Opti Balancing Preisdeckel
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: ct/kWh
    mode: box
    icon: mdi:cash-lock
  input_number.opti_balancing_done_soc:
    domain: input_number
    name: Opti Balancing Done-SoC
    initial: 98.5
    min: 90
    max: 100
    step: 0.5
    unit_of_measurement: '%'
    mode: box
    icon: mdi:battery-heart-variant
  input_number.opti_balancing_spreizungs_schwelle:
    domain: input_number
    name: Opti Balancing Spreizungs-Schwelle
    min: 0
    max: 49
    step: 1
    unit_of_measurement: mV
    mode: box
    icon: mdi:arrow-collapse-vertical
  input_number.opti_balancing_bedarf_cooldown_tage:
    domain: input_number
    name: Opti Balancing Bedarf-Cooldown Tage
    min: 0
    max: 30
    step: 1
    unit_of_measurement: Tage
    mode: box
    icon: mdi:timer-sand
  input_boolean.akku_opti_automatik:
    domain: input_boolean
    name: Akku Opti-Automatik
    icon: mdi:battery-sync
  input_boolean.hausakku_aus_netz_laden:
    domain: input_boolean
    name: Hausakku aus Netz laden
    icon: mdi:transmission-tower
  input_boolean.hausakku_wurde_netzgeladen:
    domain: input_boolean
    name: Hausakku wurde netzgeladen (Flag)
    icon: mdi:battery-check
  input_boolean.akku_nach_preis_laden:
    domain: input_boolean
    name: Akku nach Preis laden
    icon: mdi:currency-eur
  input_boolean.speicher_eco_netzladen:
    domain: input_boolean
    name: Speicher Eco Netzladen
    icon: mdi:leaf
  input_boolean.opti_manuelle_ladegrenze:
    domain: input_boolean
    name: Prognoseunabhängige Ladegrenze
    icon: mdi:battery-edit
    initial: false
  input_boolean.opti_prognose_netzladen:
    domain: input_boolean
    name: Opti Reserve-halten bei schlechter Prognose
    icon: mdi:transmission-tower
  input_boolean.opti_pv_ueberschuss_ladung:
    domain: input_boolean
    name: Opti PV-Überschussladung erlauben
    icon: mdi:solar-power
  input_boolean.opti_ev_akku_pause:
    domain: input_boolean
    name: Opti EV Akku-Pause
    icon: mdi:car-electric
  input_boolean.opti_balancing_netzladen:
    domain: input_boolean
    name: Opti Balancing darf ans Netz
    icon: mdi:battery-heart-variant
  input_boolean.opti_balancing_abschluss_gueltig:
    domain: input_boolean
    name: Opti Balancing Abschluss gültig
    icon: mdi:calendar-check
  counter.tage_seit_akku100:
    domain: counter
    name: Tage seit Akku 100%
    step: 1
    icon: mdi:counter
  counter.opti_balancing_done_minuten:
    domain: counter
    name: Opti Balancing Done-Minuten
    minimum: 0
    maximum: 30
    step: 1
    icon: mdi:timer-check-outline
  input_text.akkusteuerung_modbus_letzter_schreibwert:
    domain: input_text
    name: Akkusteuerung Modbus Letzter Schreibwert
    max: 255
  input_text.byd_bms_warnung_zuletzt_gemeldet:
    domain: input_text
    name: BYD Zuletzt gemeldete BMS-Warnung
    max: 255
  input_datetime.opti_balancing_letzter_abschluss:
    domain: input_datetime
    name: Opti Balancing letzter Abschluss
    has_date: true
    has_time: true
  input_datetime.akkusteuerung_modbus_letzter_schreibzeitpunkt:
    domain: input_datetime
    name: Akkusteuerung Modbus Letzter Schreibzeitpunkt
    has_date: true
    has_time: true
helper_defaults:
  input_select.akkusteuerung_modus: Akku Pause
  input_number.akkusteuerung_ladestaerke_soll: 2000
  input_number.akkusteuerung_min_ladestaerke: 0
  input_number.akkusteuerung_max_ladestaerke: 3000
  input_number.akkusteuerung_entladestaerke_soll: 2000
  input_number.akkusteuerung_min_entladestaerke: 0
  input_number.akkusteuerung_max_entladestaerke: 5000
  input_number.akkusteuerung_wr_ac_ueberschuss_grenze: 0
  input_number.akkusteuerung_wr_70proz_ueberschuss_grenze: 0
  input_number.akkusteuerung_ueberschuss_veto_grenze: 500
  input_number.akkusteuerung_ueberschuss_veto_aus_grenze: 250
  input_number.akkusteuerung_ueberschuss_veto_knappheit_faktor: 1
  input_number.minsoc: 10
  input_number.maxsoc: 95
  input_number.ladepreis: -1
  input_number.mindestpreisdifferenz_lade_entladepreis: 0.08
  input_number.opti_peak_verbrauch_kw: 0.8
  input_number.opti_einspeiseverguetung_ct: 0
  input_number.opti_netzlade_spread_ct: 10
  input_number.opti_peak_min_aufschlag_ct: 5
  input_number.opti_forecast_optimismus: 0
  input_number.opti_halte_spread_ct: 5
  input_number.opti_balancing_intervall_tage: 0
  input_number.opti_balancing_karenz_tage: 3
  input_number.opti_balancing_max_ct: 0
  input_number.opti_balancing_done_soc: 98.5
  input_number.opti_balancing_spreizungs_schwelle: 0
  input_number.opti_balancing_bedarf_cooldown_tage: 5
  input_boolean.akku_opti_automatik: 'off'
  input_boolean.hausakku_aus_netz_laden: 'off'
  input_boolean.hausakku_wurde_netzgeladen: 'off'
  input_boolean.akku_nach_preis_laden: 'off'
  input_boolean.speicher_eco_netzladen: 'off'
  input_boolean.opti_manuelle_ladegrenze: 'off'
  input_boolean.opti_prognose_netzladen: 'on'
  input_boolean.opti_pv_ueberschuss_ladung: 'on'
  input_boolean.opti_ev_akku_pause: 'off'
  input_boolean.opti_balancing_netzladen: 'off'
  input_boolean.opti_balancing_abschluss_gueltig: 'off'
  counter.tage_seit_akku100: 0
  counter.opti_balancing_done_minuten: 0
  input_text.akkusteuerung_modbus_letzter_schreibwert: ''
  input_text.byd_bms_warnung_zuletzt_gemeldet: ''
  input_datetime.opti_balancing_letzter_abschluss: ''
  input_datetime.akkusteuerung_modbus_letzter_schreibzeitpunkt: ''
